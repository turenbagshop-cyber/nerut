<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asset Editor</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1f3f5;--fg:#14171a;--card:#fff;--bd:#d5dae0;--ac:#1a73e8;--acfg:#fff;--mu:#5f6b76}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121518;--fg:#eceff1;--card:#1d2226;--bd:#333b42;--ac:#6ea8ff;--acfg:#08111f;--mu:#9aa6b0}}
:root[data-theme="dark"]{--bg:#121518;--fg:#eceff1;--card:#1d2226;--bd:#333b42;--ac:#6ea8ff;--acfg:#08111f;--mu:#9aa6b0}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{flex:none;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 12px;flex-wrap:wrap}
h1{font-size:17px;margin:0}
button,select,input[type=text],input[type=number]{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
button{cursor:pointer}
button.p{background:var(--ac);color:var(--acfg);border-color:var(--ac);font-weight:600}
.tool{flex:1;min-height:0;display:flex;flex-direction:column}
.bar{flex:none;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 12px 6px}
.app{flex:1;min-height:0;display:flex}
.view{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{position:relative;flex:none;width:300px;height:300px;border:1px solid var(--bd);border-radius:6px;overflow:hidden;line-height:0;background:#888}
canvas{width:100%;height:100%;display:block;cursor:pointer}
.sel{position:absolute;left:0;width:100%;border:2px solid #ff3b30;box-shadow:0 0 0 1px #fff inset;pointer-events:none;display:none}
.hint{margin:0 12px 6px;color:var(--mu);font-size:13px}
.drawer{position:fixed;top:0;bottom:0;right:0;z-index:20;width:min(340px,86vw);overflow-y:auto;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-left:1px solid var(--bd);box-shadow:-4px 0 16px rgba(0,0,0,.25);transform:translateX(105%);transition:transform .2s}
.app.left .drawer{right:auto;left:0;border-left:0;border-right:1px solid var(--bd);box-shadow:4px 0 16px rgba(0,0,0,.25);transform:translateX(-105%)}
.drawer.open,.app.left .drawer.open{transform:none}
.drawer h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.scrim{position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.2)}
fieldset{border:1px solid var(--bd);border-radius:10px;margin:0 0 10px;padding:10px}
legend{font-weight:600;font-size:13px;color:var(--mu);padding:0 4px}
.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.r label{font-size:13px;color:var(--mu)}
input[type=color]{width:44px;height:36px;padding:2px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
input[type=range]{flex:1;min-width:120px}
input[type=text]{flex:1;min-width:140px}
input[type=number]{width:70px}
</style>
</head>
<body>
<header>
  <h1>Asset Editor</h1>
  <div class="r" style="margin:0">
    <button id="tAd" class="p">Adboard</button>
    <button id="tKit">Kit</button>
    <button id="bSide">Panel ⇄</button>
  </div>
</header>

<!-- ADBOARD -->
<div class="tool" id="vAd">
  <div class="bar">
    <button id="bImport" class="p">Impor adboard asli (16 baris)</button>
    <button id="bClearAll">Hapus gambar semua baris</button>
    <button id="bResetAll">Reset semua</button>
    <button id="bDl" class="p">Unduh PNG</button>
  </div>
  <p class="hint" id="adInfo">Template 1024×1024 px · 16 baris (1024×64 px). Baris 1–14 bisa diedit, baris 15–16 terkunci.</p>
  <div class="app">
    <div class="view" id="view"><div class="stage" id="stage"><canvas id="cv"></canvas><div class="sel" id="sel"></div></div></div>
    <aside class="drawer" id="panel">
      <h2><span id="ptitle">Baris 1</span><button id="bClose">Tutup</button></h2>
      <fieldset><legend>Gambar</legend>
        <div class="r"><button id="bImg" class="p">Impor gambar</button><button id="bImgDel">Hapus gambar (kosongkan)</button></div>
        <div class="r"><label>Penyesuaian</label>
          <select id="fit"><option value="cover">Cover (penuh, dipotong)</option><option value="stretch">Stretch (pas persis)</option><option value="contain">Contain (utuh, ada sisa)</option></select></div>
        <div class="r"><label>Posisi</label><input type="range" id="pos" min="0" max="100" value="50"></div>
      </fieldset>
      <fieldset><legend>Warna latar</legend>
        <div class="r"><label><input type="checkbox" id="bgOn"> Ganti warna latar baris</label><input type="color" id="bg" value="#1565c0"></div>
      </fieldset>
      <fieldset><legend>Teks</legend>
        <div class="r"><input type="text" id="text" placeholder="Tulis teks di sini"></div>
        <div class="r"><input type="color" id="color" value="#ffffff"><label>Ukuran</label><input type="number" id="size" min="6" max="200" value="36"><label>Spasi</label><input type="number" id="ls" min="-10" max="60" value="0"></div>
        <div class="r">
          <select id="font"><option>Arial</option><option>Impact</option><option>Georgia</option><option>Verdana</option><option>Trebuchet MS</option><option>Courier New</option><option>system-ui</option></select>
          <select id="align"><option value="center">Tengah</option><option value="left">Kiri</option><option value="right">Kanan</option></select>
          <label><input type="checkbox" id="bold" checked> Tebal</label><label><input type="checkbox" id="ital"> Miring</label>
        </div>
      </fieldset>
      <div class="r"><button id="bReset">Reset baris ini</button><button id="bRowDl">Unduh baris ini</button></div>
    </aside>
  </div>
</div>

<!-- KIT -->
<div class="tool" id="vKit" hidden>
  <div class="bar">
    <select id="kType"><option value="jersey">Jersey 512×512</option><option value="shorts">Celana 256×256</option></select>
    <button id="kAuto" class="p">Foto jersey (otomatis)</button>
    <button id="kTexBtn">Gambar depan</button>
    <button id="kBackBtn" class="p">Gambar belakang</button>
    <select id="kTexFit"><option value="cover">Cover</option><option value="stretch">Stretch</option><option value="contain">Contain</option></select>
    <button id="kTexDel">Hapus</button>
    <label class="hint" style="margin:0"><input type="checkbox" id="kGuide" checked> Garis bantu</label>
    <button id="kReset">Reset kit</button>
    <button id="kDl" class="p">Unduh PNG</button>
  </div>
  <p class="hint" id="kInfo"></p>
  <div class="app">
    <div class="view" id="kview"><div class="stage" id="kstage"><canvas id="kcv"></canvas></div></div>
    <aside class="drawer" id="kpanel">
      <h2><span id="kTitle">Bagian</span><button id="kClose">Tutup</button></h2>
      <fieldset><legend>Warna</legend>
        <div class="r"><label>Warna</label><input type="color" id="kc1"><span id="kc2w"><label>Warna dalam</label> <input type="color" id="kc2"></span></div>
      </fieldset>
      <fieldset><legend>Gambar bagian ini</legend>
        <div class="r"><button id="kImg" class="p">Impor gambar</button><button id="kImgDel">Hapus</button></div>
        <div class="r"><select id="kfit"><option value="cover">Cover</option><option value="stretch">Stretch</option><option value="contain">Contain</option></select></div>
        <div class="r"><label>Posisi</label><input type="range" id="kpos" min="0" max="100" value="50"></div>
        <div class="r"><label><input type="checkbox" id="kfh"> Balik horizontal</label><label><input type="checkbox" id="kfv"> Balik vertikal</label></div>
      </fieldset>
      <fieldset id="kTxt"><legend>Teks</legend>
        <div class="r"><input type="text" id="ktext" placeholder="Captain"><input type="color" id="ktc"></div>
      </fieldset>
      <fieldset><legend>Posisi dan ukuran (px template)</legend>
        <div id="kRects"></div>
        <div class="r"><label>Kolom: x, y, lebar, tinggi</label></div>
      </fieldset>
      <div class="r"><button id="kZReset">Reset bagian ini</button></div>
    </aside>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<input type="file" id="kfAuto" accept="image/*" hidden>
<input type="file" id="fAll" accept="image/*" hidden>
<input type="file" id="fImg" accept="image/*" hidden>
<input type="file" id="kfImg" accept="image/*" hidden>
<input type="file" id="kfTex" accept="image/*" hidden>
<input type="file" id="kfBack" accept="image/*" hidden>

<script>
const $=id=>document.getElementById(id);
const PAL=['#000000','#ffffff','#e53935'];
const contrast=c=>c==='#ffffff'?'#000000':'#ffffff';
function fitImg(c,im,x,y,w,h,fit,pos){
  const iw=im.naturalWidth||im.width,ih=im.naturalHeight||im.height;let dw=w,dh=h,dx=0,dy=0;
  if(fit!=='stretch'){const s=fit==='cover'?Math.max(w/iw,h/ih):Math.min(w/iw,h/ih);dw=iw*s;dh=ih*s;const f=fit==='cover'?pos/100:.5;dx=(w-dw)*f;dy=(h-dh)*f;}
  c.imageSmoothingQuality='high';c.drawImage(im,x+dx,y+dy,dw,dh);
}
const TUREN_BLOGGER_ORIGIN='https://nerutlabs.blogspot.com';
let turenSaveGatePending=null;
function requestTurenSaveGate(){
  if(window.parent===window)return Promise.resolve();
  try{if(!document.referrer||new URL(document.referrer).origin!==TUREN_BLOGGER_ORIGIN)return Promise.resolve();}catch(_){return Promise.resolve();}
  if(turenSaveGatePending)return turenSaveGatePending;
  const requestId='asset-save-'+Date.now()+'-'+Math.random().toString(36).slice(2);
  turenSaveGatePending=new Promise(resolve=>{
    const cleanup=()=>{window.removeEventListener('message',onMessage);turenSaveGatePending=null;};
    const onMessage=event=>{if(event.origin!==TUREN_BLOGGER_ORIGIN||event.source!==window.parent)return;const d=event.data;if(!d||d.type!=='TUREN_SAVE_UNLOCKED'||d.requestId!==requestId)return;cleanup();resolve();};
    window.addEventListener('message',onMessage);
    window.parent.postMessage({type:'TUREN_SAVE_REQUEST',requestId},TUREN_BLOGGER_ORIGIN);
  });
  return turenSaveGatePending;
}
async function save(canvas,name){
  try{
    await requestTurenSaveGate();
    const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Gagal membuat PNG.')),'image/png'));
    const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
  }catch(e){console.error('Gagal menyimpan aset:',e);alert('Gagal menyimpan: '+(e&&e.message||e));}
}
function load(file,cb){const im=new Image();im.onload=()=>cb(im);im.src=URL.createObjectURL(file);}
function fitStage(v,s){const z=Math.max(100,Math.min(v.clientWidth,v.clientHeight)-24);s.style.width=s.style.height=z+'px';}
const fitAll=()=>{fitStage($('view'),$('stage'));fitStage($('kview'),$('kstage'));};
new ResizeObserver(fitAll).observe($('view'));new ResizeObserver(fitAll).observe($('kview'));
document.querySelectorAll('.app').forEach(a=>a.id||0);
$('bSide').onclick=()=>document.querySelectorAll('.app').forEach(a=>a.classList.toggle('left'));
function tab(t){$('bClose').click();$('kClose').click();$('vAd').hidden=t!=='ad';$('vKit').hidden=t!=='kit';$('tAd').classList.toggle('p',t==='ad');$('tKit').classList.toggle('p',t==='kit');fitAll();}
$('tAd').onclick=()=>tab('ad');$('tKit').onclick=()=>tab('kit');

/* ===== ADBOARD ===== */
const N=16,NE=14,W=1024,RH=64,cv=$('cv'),ctx=cv.getContext('2d');cv.width=W;cv.height=W;
const defRow=i=>({bg:null,img:null,fit:'cover',pos:50,text:'',color:contrast(PAL[i%3]),size:36,ls:0,font:'Arial',bold:true,ital:false,align:'center'});
const rows=Array.from({length:NE},(_,i)=>defRow(i));let sel=-1;
function drawRow(c,r,y,i){
  c.save();c.beginPath();c.rect(0,y,W,RH);c.clip();
  c.fillStyle=r.bg||PAL[i%3];c.fillRect(0,y,W,RH);
  if(r.img)fitImg(c,r.img,0,y,W,RH,r.fit,r.pos);
  if(r.text){
    c.font=(r.ital?'italic ':'')+(r.bold?'bold ':'')+r.size+'px '+r.font;
    if('letterSpacing' in c)c.letterSpacing=r.ls+'px';
    c.fillStyle=r.color;c.textBaseline='middle';c.textAlign=r.align;
    c.fillText(r.text,r.align==='left'?24:r.align==='right'?W-24:W/2,y+RH/2+1);
  }
  c.restore();
}

const logoOk=()=>LOGO.complete&&LOGO.naturalWidth>0;
function wmRows(c){
  let y=14*RH;c.save();c.fillStyle='#0f0f0f';c.fillRect(0,y,W,RH);
  c.font='600 34px Arial, sans-serif';c.textBaseline='middle';c.textAlign='left';
  const t1='nerutlabs',x0=(W-(76+c.measureText(t1).width))/2;
  c.fillStyle='#ff0000';c.beginPath();c.roundRect(x0,y+12,60,40,12);c.fill();
  c.fillStyle='#ffffff';c.beginPath();c.moveTo(x0+24,y+22);c.lineTo(x0+24,y+42);c.lineTo(x0+40,y+32);c.closePath();c.fill();
  c.fillText(t1,x0+76,y+33);
  y=15*RH;c.fillStyle='#ffffff';c.fillRect(0,y,W,RH);
  const t2='nerutlabs.blogspot.com',lh=48,lw=logoOk()?LOGO.naturalWidth/LOGO.naturalHeight*lh:0,gap=lw?16:0;
  const x1=(W-(lw+gap+c.measureText(t2).width))/2;
  if(lw)c.drawImage(LOGO,x1,y+8,lw,lh);
  c.fillStyle='#1f2d36';c.fillText(t2,x1+lw+gap,y+33);c.restore();
}
function wmKit(c,K){
  if(!logoOk())return;
  const r=LOGO.naturalWidth/LOGO.naturalHeight;
  if(K.S===512){
    const h=96,w=h*r,cx=438,t='nerutlabs.blogspot.com';c.drawImage(LOGO,cx-w/2,350,w,h);
    c.save();c.fillStyle='#1f2d36';c.textAlign='center';c.textBaseline='middle';
    c.font='bold 13px Arial';const mw=c.measureText(t).width;c.font='bold '+(mw>150?13*150/mw:13)+'px Arial';
    c.fillText(t,cx,468);c.restore();
  }else c.drawImage(LOGO,4,4,22*r,22);
}
const render=()=>{rows.forEach((r,i)=>drawRow(ctx,r,i*RH,i));wmRows(ctx);};
function select(i){
