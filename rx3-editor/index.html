<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RX3 Editor Beta – NerutLabs</title>
<style>:root{
  --bg:#14171c; --bg2:#1b1f26; --bg3:#232833; --bg4:#2c3340; --line:#323a48; --fg:#e6e9ef; --fg2:#9aa4b5; --fg3:#6b7587;
  --acc:#3d9bff; --acc2:#1f6fd1; --ok:#35c07a; --warn:#f0b23a; --err:#ee5a5a; --sel:#ffb02e;
  --r:6px; --top:46px; --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="light"]{
  --bg:#eef0f4; --bg2:#ffffff; --bg3:#f3f5f9; --bg4:#e3e8f0; --line:#ccd3de; --fg:#1c2230; --fg2:#566074; --fg3:#8a93a5; --acc:#1768d6; --acc2:#0f52ad;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px/1.35 var(--font);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--bg4);border:1px solid var(--line);border-radius:var(--r);padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--acc)}
button:active{background:var(--bg3)}
button.primary{background:var(--acc2);border-color:var(--acc);color:#fff}
button.danger{background:#6e2323;border-color:#a33}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{background:var(--bg4)}
button.sm{padding:2px 7px;font-size:12px}
button[disabled]{opacity:.4;pointer-events:none}
button.on{background:var(--acc2);border-color:var(--acc);color:#fff}
input[type=text],input[type=number],input:not([type]),select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 6px;min-width:0}
input:focus,select:focus,textarea:focus{outline:1px solid var(--acc);border-color:var(--acc)}
input[type=color]{padding:0;width:30px;height:26px;border:1px solid var(--line);background:none;border-radius:4px}
input[type=checkbox]{accent-color:var(--acc)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:5px}::-webkit-scrollbar-track{background:transparent}

#app{display:grid;grid-template-rows:var(--top) 1fr;height:100%}
.top{display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.top::-webkit-scrollbar{display:none}
.brand{font-weight:700;letter-spacing:.2px;margin-right:6px;display:flex;align-items:center;gap:6px}

.sep{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}
.tabs{display:flex;gap:2px;background:var(--bg);padding:2px;border-radius:8px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;border-radius:6px;padding:5px 11px}
.tabs button.on{background:var(--acc2);color:#fff}
.grow{flex:1}
.pname{color:var(--fg2);max-width:30vw;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:#000;font-size:11px;text-align:center}
.menu{position:relative;flex:none}
.menu-list{position:fixed;z-index:50;background:var(--bg2);border:1px solid var(--line);border-radius:8px;min-width:240px;padding:4px;box-shadow:0 8px 30px #0008}
.menu-list button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px}
.menu-list button:hover{background:var(--bg4)}
.menu-list hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu-list small{display:block;color:var(--fg3);padding:2px 10px 4px}

#body{display:grid;grid-template-columns:270px 1fr 310px;min-height:0;position:relative}
#body.no-right{grid-template-columns:270px 1fr 0}
.panel{background:var(--bg2);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
.ptabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.ptabs button{flex:1;border:0;border-radius:0;background:transparent;padding:8px 4px;color:var(--fg2)}
.ptabs button.on{color:var(--fg);box-shadow:inset 0 -2px var(--acc)}
.pbody{flex:1;overflow:auto;min-height:0}
.pbar{display:flex;gap:4px;padding:6px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none}
.pbar input{flex:1;min-width:80px}
#main{position:relative;min-width:0;min-height:0;background:var(--bg);display:flex;flex-direction:column}
.view{display:none;flex:1;min-height:0;min-width:0}
.view.on{display:flex;flex-direction:column}

/* tree */
.tree-row{display:flex;align-items:center;gap:4px;padding:3px 6px;cursor:pointer;white-space:nowrap;border-left:2px solid transparent}
.tree-row:hover{background:var(--bg3)}
.tree-row.sel{background:#3d9bff26;border-left-color:var(--acc)}
.tree-row.drop{outline:1px dashed var(--acc)}
.tree-row .t{flex:1;overflow:hidden;text-overflow:ellipsis}
.tree-row .tp{color:var(--fg3);font-size:11px}
.tree-row .ic{width:16px;text-align:center;color:var(--fg3);flex:none}
.tree-row .tg{opacity:.55;padding:0 3px;border-radius:3px}
.tree-row .tg:hover{opacity:1;background:var(--bg4)}
.tree-row .tg.off{opacity:.25}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
.dirrow{color:var(--fg2);font-weight:600}
.k-layout{color:#7cc4ff}.k-nav{color:#c79bff}.k-dd{color:#7be0b0}.k-lua{color:#ffd37a}.k-image{color:#ff9ad0}.k-vvm{color:#9aa7ff}

/* canvas */
.ctool{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:none}
.ctool::-webkit-scrollbar{display:none}
.ctool label{display:flex;gap:4px;align-items:center;color:var(--fg2);white-space:nowrap}
.ctool select{max-width:140px}
#viewport{position:relative;flex:1;overflow:hidden;touch-action:none;background:
  repeating-conic-gradient(var(--bg3) 0 25%,var(--bg) 0 50%) 0 0/20px 20px;cursor:default;user-select:none;-webkit-user-select:none}
#viewport.hand{cursor:grab}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;background:#0b0d11;box-shadow:0 0 0 1px #000,0 10px 40px #0009;outline:none}
#overlay{position:absolute;left:0;top:0;pointer-events:none;transform-origin:0 0}
.nd{position:absolute;box-sizing:border-box;overflow:visible;pointer-events:auto}
.nd.edit{outline:1px dashed rgba(120,170,255,.28)}
.nd.hid{opacity:.25}
.nd.nohit{pointer-events:none}
.nd.hover{outline:1px solid rgba(255,176,46,.8)}
.nd .tag{position:absolute;left:0;top:-13px;font:9px var(--mono);color:#9fc4ff;background:#0b0d11cc;padding:0 3px;white-space:nowrap;pointer-events:none;display:none}
#stage.names .nd .tag{display:block}
.nd-Label{display:flex;color:#fff;font-size:18px;overflow:hidden}
.nd-Label span{width:100%;white-space:pre-wrap;word-break:break-word}
.nd-Rectangle{background:#ffffff33}
.nd-Image,.nd-Asset,.nd-VisualPanel{background-size:100% 100%;background-repeat:no-repeat}
.nd.ph{background:repeating-linear-gradient(45deg,#2b3344 0 8px,#222a39 8px 16px);border:1px solid #4a5670}
.nd.ph::after{content:attr(data-ph);position:absolute;left:2px;bottom:1px;right:2px;font:9px var(--mono);color:#8fa0c0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd-tile{background:linear-gradient(160deg,#2f6bd0,#1c3f7f);border-radius:6px;color:#fff;display:flex;align-items:flex-end;padding:8px;font-weight:600}
.nd-tile .tt{font-size:14px;text-shadow:0 1px 3px #000a;overflow:hidden}
.nd-btn{background:linear-gradient(#3a8cf0,#2060b8);border-radius:5px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;padding:0 6px;text-align:center;overflow:hidden}
.nd-btn.grey{background:linear-gradient(#777,#555)}
.nd-toggle{background:#1c2536;border:1px solid #3b4a68;border-radius:4px;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.nd-slider{background:#2a3347;border-radius:12px;height:6px}
.nd-slider::after{content:"";position:absolute;left:40%;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:#7cc4ff}
.nd-box{background:rgba(120,160,255,.05)}
.guide{position:absolute;background:#ff4fa3;pointer-events:none;z-index:5}
.selbox{position:absolute;border:1.5px solid var(--sel);pointer-events:none;box-sizing:border-box}
.selbox.multi{border-style:dashed}
.handle{position:absolute;width:var(--hs,10px);height:var(--hs,10px);background:#fff;border:1.5px solid var(--sel);border-radius:2px;pointer-events:auto;touch-action:none;box-sizing:border-box}
.handle.big{width:calc(var(--hs,10px)*1.6);height:calc(var(--hs,10px)*1.6)}
.sizelabel{position:absolute;background:var(--sel);color:#000;font:10px var(--mono);padding:0 4px;border-radius:3px;white-space:nowrap;pointer-events:none}
.zoomhud{position:absolute;right:10px;bottom:10px;background:#000a;color:#fff;border-radius:6px;padding:3px 8px;font:11px var(--mono);pointer-events:none}
.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--fg2);max-width:420px;padding:20px}
.hint h2{color:var(--fg);margin:0 0 8px}

/* inspector */
.sec{border-bottom:1px solid var(--line)}
.sec>.sh{display:flex;align-items:center;gap:6px;padding:7px 10px;cursor:pointer;font-weight:600;color:var(--fg2);user-select:none}
.sec>.sh:hover{color:var(--fg)}
.sec>.sb{padding:4px 10px 10px}
.sec.closed>.sb{display:none}
.sh .car{transition:transform .15s;display:inline-block}
.sec.closed .car{transform:rotate(-90deg)}
.row{display:grid;grid-template-columns:86px 1fr;gap:6px;align-items:center;margin:4px 0}
.row>label,.lbl{color:var(--fg2);font-size:12px;display:block}
.row .f{display:flex;gap:4px;align-items:center;min-width:0}
.row .f>input,.row .f>select{flex:1;min-width:0;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid2 .row{grid-template-columns:22px 1fr;margin:0}
.grid2 .row>label{text-align:center}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;width:100%}
.seg button{flex:1;border:0;border-radius:0;padding:4px 2px;background:var(--bg);font-size:11px}
.seg button.on{background:var(--acc2);color:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--bg4);border-radius:12px;padding:1px 4px 1px 9px;margin:2px 3px 2px 0;font-size:12px}
.chip button{border:0;background:transparent;padding:0 4px}
.kv{display:grid;grid-template-columns:90px 1fr 22px;gap:4px;margin:3px 0;align-items:center}
.kv .k{color:var(--fg2);font:11px var(--mono);overflow:hidden;text-overflow:ellipsis}
.swatch{width:20px;height:20px;border-radius:4px;border:1px solid var(--line);flex:none;background-image:linear-gradient(45deg,#888 25%,transparent 25%,transparent 75%,#888 75%),linear-gradient(45deg,#888 25%,#bbb 25%,#bbb 75%,#888 75%);background-size:8px 8px;background-position:0 0,4px 4px;position:relative;overflow:hidden}
.swatch i{position:absolute;inset:0}
.muted{color:var(--fg3)}
.small{font-size:11px}
.pre{white-space:pre-wrap;margin:0}
.warnbox{background:#5a470f55;border:1px solid #7d6416;border-radius:6px;padding:6px 8px;color:#f3d98b;margin:6px 0;font-size:12px}
.infobox{background:#1c3b6a44;border:1px solid #2b5a9c;border-radius:6px;padding:6px 8px;color:#a9cdfb;margin:6px 0;font-size:12px}

/* dialogs */
.dlg-back{position:fixed;inset:0;background:#0009;z-index:100;display:flex;align-items:center;justify-content:center;padding:12px}
.dlg{background:var(--bg2);border:1px solid var(--line);border-radius:10px;width:min(460px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px #000a}
.dlg.wide{width:min(900px,100%)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-weight:700;border-bottom:1px solid var(--line)}
.dlg-h .x{border:0;background:transparent}
.dlg-b{padding:12px 14px;overflow:auto;min-height:0}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(20px);background:#000d;color:#fff;border-radius:8px;padding:8px 14px;opacity:0;pointer-events:none;transition:.2s;z-index:200;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.err{background:#7a1f1f}

/* palette */
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pal button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px;height:auto;white-space:normal;text-align:left}
.pal button b{font-size:13px}.pal button span{color:var(--fg2);font-size:11px}
.palh{margin:10px 0 4px;color:var(--fg2);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.6px}

/* tabel umum */
.scroll{overflow:auto;flex:1;min-height:0}
table.t{border-collapse:collapse;width:100%}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table.t th{position:sticky;top:0;background:var(--bg2);color:var(--fg2);font-weight:600;z-index:1}
.mono{font-family:var(--mono);font-size:12px}
.pill{display:inline-block;border-radius:10px;padding:0 7px;font-size:11px;background:var(--bg4);color:var(--fg2)}
.pill.ok{background:#1d4d35;color:#7be0b0}.pill.bad{background:#5a2020;color:#ff9a9a}.pill.warn{background:#5a470f;color:#f3d98b}
.subtabs{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--bg2);flex:none;overflow-x:auto}
.subtabs button.on{background:var(--acc2);color:#fff}
.pad{padding:10px 12px}
.cardx{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0}
.cardx h4{margin:0 0 6px;font-size:13px}
.flowrow{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(130px,1.2fr) minmax(130px,1.2fr) minmax(160px,1.6fr);gap:8px;padding:8px;border-bottom:1px solid var(--line);align-items:start}
.flowrow>div{min-width:0}
.flowrow.head{position:sticky;top:0;background:var(--bg2);color:var(--fg2);font-weight:600;z-index:1}
.flowrow input,.flowrow select{width:100%}
.tline{display:flex;gap:4px;align-items:center;margin:3px 0;flex-wrap:wrap}
.tline select{flex:1;min-width:90px}
.svgmap{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.svgmap text{fill:var(--fg);font:11px var(--mono)}
.svgmap .nb rect{fill:var(--bg3);stroke:var(--line)}
.svgmap .nb:hover rect{stroke:var(--acc)}
.svgmap .nb.miss rect{stroke:var(--err);stroke-dasharray:3 2}
.svgmap .ln{fill:none;stroke:#5a7fb8;stroke-width:1.4;opacity:.8}
.svgmap .colh{fill:var(--fg3);font:10px var(--mono);text-transform:uppercase}
.codewrap{display:flex;flex:1;min-height:0}
.codewrap>div{min-width:0;display:flex;flex-direction:column}
textarea.code{flex:1;resize:none;font:12px/1.5 var(--mono);white-space:pre;overflow:auto;tab-size:2;border-radius:0;border:0;border-right:1px solid var(--line);background:var(--bg)}
.assetgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;padding:8px}
.acell{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.acell:hover{border-color:var(--acc)}
.acell.sel{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.acell .th{height:72px;border-radius:4px;background:repeating-conic-gradient(#2a303c 0 25%,#1d222b 0 50%) 0 0/12px 12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.acell .th img{max-width:100%;max-height:100%}
.acell .th.miss{background:repeating-linear-gradient(45deg,#3a2326 0 6px,#2d1b1e 6px 12px);color:#ff9a9a;font-size:10px}
.acell .nm{font:11px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidesplit{display:flex;flex:1;min-height:0}
.sidesplit>.list{width:260px;border-right:1px solid var(--line);overflow:auto;flex:none}
.sidesplit>.detail{flex:1;overflow:auto;padding:10px 12px;min-width:0}

#mobbar{display:none}
.drawer-close{display:none}
@media (max-width:900px){
  :root{--top:44px}
  #body,#body.no-right{grid-template-columns:1fr}
  #left,#right{position:absolute;top:0;bottom:48px;z-index:30;width:min(88vw,340px);transition:transform .2s;box-shadow:0 0 30px #000a}
  #left{left:0;transform:translateX(-105%)}
  #right{right:0;transform:translateX(105%)}
  body.show-left #left{transform:none}
  body.show-right #right{transform:none}
  #body.no-right #right{display:none}
  #body{padding-bottom:48px}
  #mobbar{display:flex;position:fixed;left:0;right:0;bottom:0;height:48px;background:var(--bg2);border-top:1px solid var(--line);z-index:40}
  #mobbar button{flex:1;border:0;border-radius:0;background:transparent}
  .pname,.hide-m{display:none}
  .sidesplit{flex-direction:column}.sidesplit>.list{width:100%;max-height:34vh;border-right:0;border-bottom:1px solid var(--line)}
  .flowrow{grid-template-columns:1fr}
  .flowrow.head{display:none}
  .dlg.wide{width:100%}
  .row{grid-template-columns:78px 1fr}
  #toast{bottom:62px}
}

.biggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;padding:0 8px 8px}
.bigprev{margin:6px 0;max-height:260px;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#2a303c 0 25%,#1d222b 0 50%) 0 0/12px 12px;border-radius:6px;overflow:auto}
.bigprev img{max-width:100%;max-height:256px;image-rendering:auto}

.aecard .aeth{width:64px;height:64px;flex:none;border-radius:6px;background:repeating-conic-gradient(#2a303c 0 25%,#1d222b 0 50%) 0 0/12px 12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.aecard .aeth img{max-width:100%;max-height:100%}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="brand"><i></i><span class="hide-m">RX3 Editor Beta</span></div>
    <div class="menu"><button id="m-open">Buka ▾</button></div>
    <div class="menu"><button id="m-save" class="primary">Simpan ▾</button></div>
    <button id="b-undo" title="Urungkan (Ctrl+Z)">↶</button>
    <button id="b-redo" title="Ulangi (Ctrl+Y)">↷</button>
    <span class="sep"></span>
    <div class="tabs" id="tabs">
      <button data-m="layout" class="on">Layout</button>
      <button data-m="links">Hubungan</button>
      <button data-m="code">Kode</button>
      <button data-m="assets">Aset</button>
      <button data-m="styles">Gaya</button>
      <button data-m="big">Big</button>
      <button data-m="rx3">RX3</button>
    </div>
    <span class="grow"></span>
    <span class="pname" id="pname"></span><span class="badge" id="dirty" style="display:none"></span>
    <button class="ghost" id="b-theme" title="Tema">◐</button>
  </div>
  <div id="body">
    <aside id="left" class="panel">
      <div class="ptabs"><button data-p="files" class="on">Berkas</button><button data-p="layers">Lapisan</button></div>
      <div id="pane-files" style="display:flex;flex-direction:column;flex:1;min-height:0">
        <div class="pbar"><input id="file-filter" type="text" placeholder="cari file…"><button class="sm" id="b-addfile" title="Muat file satuan / gambar dari perangkat">＋ File</button></div>
        <div class="pbody" id="files-body"></div>
      </div>
      <div id="pane-layers" style="display:none;flex-direction:column;flex:1;min-height:0">
        <div class="pbar">
          <button class="sm primary" id="l-add" title="Tambah elemen">＋</button>
          <button class="sm" id="l-dup" title="Duplikat">⧉</button>
          <button class="sm" id="l-del" title="Hapus">🗑</button>
          <button class="sm" id="l-up" title="Naikkan lapisan (ke belakang)">↑</button>
          <button class="sm" id="l-down" title="Turunkan lapisan (ke depan)">↓</button>
          <button class="sm" id="l-in" title="Masukkan ke elemen di atasnya">⇥</button>
          <button class="sm" id="l-out" title="Keluarkan dari induk">⇤</button>
        </div>
        <div class="pbody" id="layers-body"></div>
      </div>
    </aside>
    <main id="main">
      <section class="view on" id="view-layout">
        <div class="ctool">
          <button id="t-add" class="primary">＋ Tambah</button>
          <button id="t-select" class="on" title="Pilih/geser">☝ Pilih</button>
          <button id="t-hand" title="Geser kanvas">✋ Tangan</button>
          <button id="t-img" title="Edit gambar elemen terpilih (tile, background, objek)">🖼 Gambar</button>
          <button id="z-out">−</button><button id="zoomlbl" style="min-width:56px">100%</button><button id="z-in">＋</button><button id="z-fit">Fit</button>
          <label>Latar <select id="s-bg"><option value="">otomatis</option><option value="none">tanpa</option><option value="$StageBackground">StageBackground</option><option value="$MediallionStageBackground">Medallion</option><option value="custom">gambar acuan…</option></select></label>
          <label>Snap <select id="s-snap"><option value="0">mati</option><option value="1">1px</option><option value="5">5px</option><option value="10">10px</option><option value="20">20px</option></select></label>
          <label><input type="checkbox" id="s-guides" checked> Garis bantu</label>
          <label><input type="checkbox" id="s-outline" checked> Garis tepi</label>
          <label><input type="checkbox" id="s-names"> Nama</label>
          <label><input type="checkbox" id="s-hidden" checked> Tersembunyi</label>
        </div>
        <div id="viewport">
          <div id="stage"></div>
          <div id="overlay"></div>
          <div id="cv-hint" class="hint"><h2>Mulai di sini</h2>Pilih <b>Buka → ZIP proyek</b>, lalu klik file <b>.layout</b> di panel Berkas.<br><br>Seret elemen untuk memindah, seret titik putih untuk mengubah ukuran. Cubit (2 jari) untuk zoom.</div>
          <div class="zoomhud" id="zoomhud"></div>
        </div>
      </section>
      <section class="view" id="view-links"></section>
      <section class="view" id="view-code"></section>
      <section class="view" id="view-assets"></section>
      <section class="view" id="view-styles"></section>
      <section class="view" id="view-big"></section>
      <section class="view" id="view-rx3"></section>
    </main>
    <aside id="right" class="panel">
      <div class="ptabs"><button class="on">Properti</button></div>
      <div class="pbody" id="inspector"></div>
    </aside>
  </div>
</div>
<div id="mobbar"><button id="mb-left">☰ Berkas/Lapisan</button><button id="mb-add">＋ Tambah</button><button id="mb-right">⚙ Properti</button></div>

<script>
/* ---- 00-native.js ---- */
/* ===== Jembatan ke aplikasi Android (aktif hanya jika ada window.Android dari WebView) ===== */
(() => {
  if (!window.Android) return;
  const N = (window.__native = { isNative: true });
  const b64FromBytes = (bytes) => new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result.slice(fr.result.indexOf(',') + 1));
    fr.onerror = () => rej(fr.error);
    fr.readAsDataURL(new Blob([bytes]));
  });
  const bytesFromB64 = (s) => { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
  const join = (a, b) => (a ? a + '/' + b : b);

  function mkFile(id, rel, name) {
    return {
      kind: 'file', name,
      async getFile() {
        const sz = parseInt(Android.fileSize(id, rel), 10);
        if (sz > 8 * 1048576) { // file besar: baca per potongan agar tidak menghabiskan memori
          return { name, size: sz, arrayBuffer: async () => {
            const out = new Uint8Array(sz); const CH = 3 * 1048576;
            for (let o = 0; o < sz; o += CH) {
              const s = Android.readChunk(id, rel, o, Math.min(CH, sz - o));
              if (s.startsWith('ERR:')) throw new Error(s);
              out.set(bytesFromB64(s), o);
              await new Promise((r) => setTimeout(r, 0));
            }
            return out.buffer;
          } };
        }
        const s = Android.readFile(id, rel);
        if (s.startsWith('ERR:')) throw new Error(s);
        const b = bytesFromB64(s);
        return { name, size: b.length, arrayBuffer: async () => b.buffer.slice(b.byteOffset, b.byteOffset + b.byteLength) };
      },
      async createWritable() {
        const parts = [];
        return {
          async write(d) { parts.push(d instanceof Uint8Array ? d : new Uint8Array(d)); },
          async close() {
            let n = 0; parts.forEach((p) => { n += p.length; });
            const all = new Uint8Array(n); let o = 0; parts.forEach((p) => { all.set(p, o); o += p.length; });
            if (all.length > 6 * 1048576) {
              let r = Android.writeOpen(id, rel); if (r !== 'ok') throw new Error(r);
              const CH = 3 * 1048576;
              for (let o = 0; o < all.length; o += CH) { r = Android.writePart(await b64FromBytes(all.subarray(o, o + CH))); if (r !== 'ok') { Android.writeClose(); throw new Error(r); } }
              r = Android.writeClose(); if (r !== 'ok') throw new Error(r);
              return;
            }
            const r = Android.writeFile(id, rel, await b64FromBytes(all));
            if (r !== 'ok') throw new Error(r);
          },
        };
      },
    };
  }
  function mkDir(id, rel, name) {
    return {
      kind: 'directory', name,
      async *entries() {
        const r = Android.listDir(id, rel);
        if (r.startsWith('ERR:')) throw new Error(r);
        for (const e of JSON.parse(r)) yield [e.name, e.dir ? mkDir(id, join(rel, e.name), e.name) : mkFile(id, join(rel, e.name), e.name)];
      },
      async getDirectoryHandle(n, opt) { const p = join(rel, n); if (opt && opt.create) { const r = Android.mkdirs(id, p); if (r !== 'ok') throw new Error(r); } return mkDir(id, p, n); },
      async getFileHandle(n) { return mkFile(id, join(rel, n), n); },
      async requestPermission() { return 'granted'; },
      async queryPermission() { return 'granted'; },
    };
  }

  window.showDirectoryPicker = () => new Promise((res, rej) => {
    N.onDir = (j) => {
      if (!j) { const e = new Error('dibatalkan'); e.name = 'AbortError'; rej(e); return; }
      const o = JSON.parse(j); res(mkDir(o.id, '', o.name));
    };
    Android.pickDirectory();
  });

  N.saveBlob = async (blob, name) => {
    const ok = await new Promise((res) => { N.onSaveTarget = res; Android.saveBegin(name, blob.type || 'application/octet-stream'); });
    if (!ok) return false;
    const CH = 3 * 256 * 1024;
    for (let off = 0; off < blob.size; off += CH) {
      const part = new Uint8Array(await blob.slice(off, off + CH).arrayBuffer());
      Android.saveChunk(await b64FromBytes(part));
    }
    return Android.saveEnd() === 'ok';
  };

  /* Tombol back Android: true = sudah ditangani di web */
  window.__onBack = () => {
    const d = document.querySelector('.dlg-back');
    if (d) { const x = d.querySelector('.x'); if (x) x.click(); else d.remove(); return true; }
    const m = document.querySelector('.menu-list'); if (m) { m.remove(); return true; }
    if (document.body.classList.contains('show-left') || document.body.classList.contains('show-right')) { closeDrawers(); return true; }
    const nd = dirtyFiles().length;
    if (nd) {
      confirmDlg('Keluar dari aplikasi', `Ada ${nd} file yang diubah dan belum disimpan. Keluar tanpa menyimpan?`, 'Keluar').then((ok) => { if (ok) Android.exitApp(); });
      return true;
    }
    return false;
  };
})();

/* ---- 01-util.js ---- */
'use strict';
/* ===== Util ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'for') el.htmlFor = v;
    else if (k === 'list' || k === 'dataset') { if (k === 'list') el.setAttribute('list', v); else Object.assign(el.dataset, v); }
    else if (k in el) { try { el[k] = v; } catch (e) { el.setAttribute(k, v); } }
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const round1 = (v) => Math.round(v * 10) / 10;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dirname = (p) => { const i = p.lastIndexOf('/'); return i < 0 ? '' : p.slice(0, i + 1); };
const basename = (p) => p.slice(p.lastIndexOf('/') + 1);
const extname = (p) => { const b = basename(p); const i = b.lastIndexOf('.'); return i < 0 ? '' : b.slice(i + 1).toLowerCase(); };
const deepClone = (o) => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));

function normPath(p) { return String(p).replace(/\\/g, '/').replace(/^\.?\/+/, '').replace(/\/{2,}/g, '/'); }
/** Menyelesaikan path relatif ('../a/b.lua') terhadap direktori `dir` (berakhiran '/'). */
function joinPath(dir, rel) {
  const out = [];
  for (const seg of (dir + rel).split('/')) {
    if (seg === '' || seg === '.') continue;
    if (seg === '..') out.pop(); else out.push(seg);
  }
  return out.join('/');
}

let toastTimer;
function toast(msg, kind) {
  let t = $('#toast');
  if (!t) { t = h('div', { id: 'toast' }); document.body.append(t); }

function hexNorm(v) {

  if (/^#[0-9a-f]{6}$/i.test(s)) return s.toLowerCase();

/* ---- Serializer JSON dengan gaya mirip file asli ---- */
function serializeJSON(v, ind = '') {
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  const next = ind + '    ';
  if (Array.isArray(v)) {
    if (!v.length) return '[]';
    if (v.every((x) => x === null || typeof x !== 'object') && v.length <= 6) return '[' + v.map((x) => JSON.stringify(x)).join(', ') + ']';
    return '[\n' + v.map((x) => next + serializeJSON(x, next)).join(',\n') + '\n' + ind + ']';
  }
  const keys = Object.keys(v);
  if (!keys.length) return '{}';
  return '{\n' + keys.map((k) => {
    const x = v[k];
    const isC = x !== null && typeof x === 'object' && Object.keys(x).length > 0;
    return next + JSON.stringify(k) + ':' + (isC ? '\n' + next + serializeJSON(x, next) : ' ' + serializeJSON(x, next));
  }).join(',\n') + '\n' + ind + '}';
}

const TUREN_BLOGGER_ORIGIN = 'https://turenlabs.blogspot.com';
let turenSaveGatePending = null;
function requestTurenSaveGate() {
  // Editor yang dibuka langsung tetap dapat menyimpan seperti biasa.
  if (!window.parent || window.parent === window) return Promise.resolve(true);
  if (turenSaveGatePending) return turenSaveGatePending;
  const requestId = (window.crypto && typeof window.crypto.randomUUID === 'function')
    ? window.crypto.randomUUID()
    : 'turen-save-' + Date.now() + '-' + Math.random().toString(36).slice(2);
  turenSaveGatePending = new Promise((resolve, reject) => {
    let timeoutId;
    const cleanup = () => {
      window.removeEventListener('message', onMessage);
      if (timeoutId) window.clearTimeout(timeoutId);
      turenSaveGatePending = null;
    };
    const onMessage = (event) => {
      if (event.origin !== TUREN_BLOGGER_ORIGIN || event.source !== window.parent) return;
      const data = event.data;
      if (!data || data.type !== 'TUREN_SAVE_UNLOCKED' || data.requestId !== requestId) return;
      cleanup();
      resolve(true);
    };
    window.addEventListener('message', onMessage);
    timeoutId = window.setTimeout(() => {
      cleanup();
      reject(new Error('Gerbang iklan tidak memberi sinyal selesai. Silakan coba lagi.'));
    }, 15 * 60 * 1000);
    window.parent.postMessage({ type: 'TUREN_SAVE_REQUEST', requestId }, TUREN_BLOGGER_ORIGIN);
  });
  return turenSaveGatePending;
}

const JSON_KINDS = new Set(['layout', 'dd', 'nav', 'vvm', 'lreq', 'styles', 'assetpaths', 'fonts', 'constants', 'manifest', 'uxmetatypes']);
const IMG_EXT = new Set(['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp']);
const TEXT_EXT = new Set(['lua', 'txt', 'ini', 'cfg', 'hint', 'exclude', 'bak', 'md', 'json']);

const Bus = (() => {
  const m = {};
  return {
    on(n, f) { (m[n] = m[n] || []).push(f); },

function kindOf(path) {
  const e = extname(path);
  if (JSON_KINDS.has(e)) return e;
  if (IMG_EXT.has(e)) return 'image';
  if (e === 'ttf' || e === 'otf') return 'font';
  if (e === 'lua') return 'lua';
  if (e === 'rx3') return 'rx3';
  if (e === 'big') return 'big';
  if (TEXT_EXT.has(e)) return 'text';
  return 'bin';
}

function makeFile(path, bytes, isNew) {
  const f = { path, kind: kindOf(path), bytes, isNew: !!isNew, origB: bytes, ver: 0 };
  if (f.kind === 'lua') f.luaBC = LuaBC.isBytecode(bytes);
  return f;
}

function fileGet(path) { return P.files.get(path); }

function fileJSON(f) {
  if (typeof f === 'string') f = P.files.get(f);
  if (!f || !JSON_KINDS.has(f.kind) || f.parseError) return null;
  if (f.json === undefined) {
    try {
      const t = bytesToText(f.bytes);
      f.json = JSON.parse(t);
      f.origJ = JSON.stringify(f.json);
    } catch (e) { f.parseError = String(e.message || e); return null; }
  }
  return f.json;
}
function fileText(f) {
  if (typeof f === 'string') f = P.files.get(f);
  if (!f) return null;
  if (f.text === undefined) { f.text = bytesToText(f.bytes); f.origT = f.text; }
  return f.text;
}
function isDirty(f) {
  if (f.isNew) return true;
  if (f.json !== undefined && f.origJ !== undefined && JSON.stringify(f.json) !== f.origJ) return true;
  if (f.text !== undefined && f.origT !== undefined && f.text !== f.origT) return true;
  if (f.bytes !== f.origB) return true;
  return false;
}
function fileBytes(f) {
  if (f.json !== undefined && f.origJ !== undefined && JSON.stringify(f.json) !== f.origJ) return textToBytes(serializeJSON(f.json));
  if (f.text !== undefined && f.origT !== undefined && f.text !== f.origT) return textToBytes(f.text);
  return f.bytes;
}

/* ---------- Undo / redo ---------- */
const Hist = { undo: [], redo: [], max: 300, lastKey: null, lastTime: 0 };
function snap(f) { return { j: f.json !== undefined ? JSON.stringify(f.json) : undefined, t: f.text, b: f.bytes }; }
function restore(f, s) {
  if (s.j !== undefined) f.json = JSON.parse(s.j);
  f.text = s.t; f.bytes = s.b; f.ver++;
}
function changed(paths, structural) {

/** Jalankan perubahan terhadap file-file; otomatis masuk riwayat. mergeKey = gabungkan perubahan beruntun. */
function edit(label, paths, fn, mergeKey) {
  paths = [...new Set([].concat(paths))].filter((p) => P.files.has(p));
  const fs = paths.map((p) => P.files.get(p));
  fs.forEach((f) => { if (JSON_KINDS.has(f.kind)) fileJSON(f); else if (f.kind !== 'lua' || !f.luaBC) fileText(f); });
  const before = fs.map(snap);
  const r = fn();
  fs.forEach((f) => { f.ver++; });
  const after = fs.map(snap);
  const same = before.every((b, i) => b.j === after[i].j && b.t === after[i].t && b.b === after[i].b);
  if (!same) {
    const now = Date.now();
    const last = Hist.undo[Hist.undo.length - 1];
    if (mergeKey && last && Hist.lastKey === mergeKey && now - Hist.lastTime < 1200 && last.paths.join('|') === paths.join('|')) {
      last.after = after;
    } else {
      Hist.undo.push({ label, paths, before, after });
      if (Hist.undo.length > Hist.max) Hist.undo.shift();
    }
    Hist.redo = []; Hist.lastKey = mergeKey || null; Hist.lastTime = now;
    changed(paths);
  }
  return r;
}
function undo() {
  const e = Hist.undo.pop(); if (!e) return;
  e.paths.forEach((p, i) => restore(P.files.get(p), e.before[i]));
  Hist.redo.push(e); Hist.lastKey = null; changed(e.paths); toast('Urungkan: ' + e.label);
}
function redo() {
  const e = Hist.redo.pop(); if (!e) return;
  e.paths.forEach((p, i) => restore(P.files.get(p), e.after[i]));
  Hist.undo.push(e); Hist.lastKey = null; changed(e.paths); toast('Ulangi: ' + e.label);
}


/* Perubahan langsung (drag): snapshot di awal, riwayat dicatat di akhir. */
function beginManual(path) { const f = P.files.get(path); fileJSON(f); return { path, before: snap(f) }; }

  if (Hist.undo.length > Hist.max) Hist.undo.shift();
  Hist.redo = []; Hist.lastKey = null; changed([hd.path]); return true;
}

function initCanvas() {
  const vp = vpEl();
  vp.addEventListener('pointerdown', onDown);
  vp.addEventListener('pointermove', onMove);
  vp.addEventListener('pointerup', onUp);
  vp.addEventListener('pointercancel', onUp);
  vp.addEventListener('wheel', onWheel, { passive: false });
  vp.addEventListener('contextmenu', (e) => e.preventDefault());
  Assets.setOnReady(debounce(() => { if (S.layout && S.mode === 'layout') renderCanvas(); }, 60));
  new ResizeObserver(() => { renderOverlay(); }).observe(vp);
  document.addEventListener('keyup', (e) => { if (e.code === 'Space') { spaceDown = false; vpEl().classList.remove('hand'); } });
  document.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); saveZip(false); return; }
    if (typing) return;
    if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
    if (S.mode !== 'layout') return;
    if (e.code === 'Space') { spaceDown = true; e.preventDefault(); return; }
    if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); opDuplicate(); return; }
    if (mod && e.key.toLowerCase() === 'c') { opCopy(); return; }
    if (mod && e.key.toLowerCase() === 'v') { opPaste(); return; }
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); opDelete(); return; }
    if (e.key === 'Escape') { setSel([]); return; }
    const st = e.shiftKey ? 10 : 1;
    if (e.key === 'ArrowLeft') { e.preventDefault(); nudge(-st, 0); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); nudge(st, 0); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); nudge(0, -st); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); nudge(0, st); }
  });
  Bus.on('change', (d) => {
    if (S.layout && !P.files.has(S.layout)) { S.layout = null; S.sel = []; }
    if (S.mode === 'layout' || d.structural) renderCanvas();
    // validasi seleksi
    const root = curRoot(); let trimmed = false;
    if (root) { const ok = S.sel.filter((p) => Model.nodeAt(root, p)); if (ok.length !== S.sel.length) { S.sel = ok; trimmed = true; } }
    renderOverlay(); Bus.emit(trimmed ? 'select' : 'refresh');
  });
}

const uxRel = (p) => (P.uxRoot && p.startsWith(P.uxRoot) ? p.slice(P.uxRoot.length) : p);
const short = (p) => basename(p);

function patchLuaString(luaPath, from, to, { all = true } = {}) {
  const f = P.files.get(luaPath); if (!f) return 0;
  const src = f.luaBC ? srcOf(luaPath) : null;
  const paths = [luaPath].concat(src ? [src.path] : []);
  let n = 0;
  edit(`Ubah "${from}" → "${to}" di ${short(luaPath)}`, paths, () => {
    if (f.luaBC) { const r = LuaBC.patch(f.bytes, (bc) => LuaBC.replaceAll(bc, from, to)); f.bytes = r.bytes; n = r.result; }
    const target = f.luaBC ? src : f;
    if (target) {
      const t = fileText(target);
      const re = new RegExp('(["\'])' + from.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\1', 'g');
      const out = t.replace(re, (m, q) => { if (!f.luaBC) n++; return q + to + q; });
      target.text = out;
    }
  });
  return n;
}

function flowRows(layoutPath) {
  const root = Model.layoutRoot(P.files.get(layoutPath)); if (!root) return [];
  const comp = Model.companions(layoutPath);
  return Model.collectActions(root).map((ar) => ({ ar, comp, flow: Model.actionFlow(ar.value, comp) }));

function drawFlowSvg(rows) {
  const cols = [[], [], [], []]; const idx = [new Map(), new Map(), new Map(), new Map()];
  const slot = (c, label, extra) => { if (!idx[c].has(label)) { idx[c].set(label, { label, i: cols[c].length, ...extra }); cols[c].push(idx[c].get(label)); } return idx[c].get(label); };
  const edges = [];
  rows.forEach((r) => {
    const b = slot(0, (r.ar.owner.name || r.ar.owner.commonName), { node: r.ar.owner });
    const a = slot(1, r.ar.value || '(kosong)');
    edges.push([b, a, 0]);
    const evs = [];
    if (r.flow.event) evs.push([r.flow.event, 0]);
    r.flow.luaHandlers.forEach((l) => l.events.forEach((e) => evs.push([e, 1])));
    if (!evs.length) { const e = slot(2, '—', { miss: true }); edges.push([a, e, 0]); }
    evs.forEach(([e, dash]) => {
      const en = slot(2, e); edges.push([a, en, dash]);
      const trs = Model.links().eventsMap.get(e) || [];
      if (!trs.length) { const t = slot(3, '(nav tidak ada)', { miss: true }); edges.push([en, t, dash]); }
      trs.forEach((tr) => tr.targets.forEach((tn) => { const t = slot(3, tn); edges.push([en, t, dash]); }));
    });
  });
  const rowH = 28, W = 900, colX = [10, 240, 470, 700], bw = 190;
  const H = Math.max(...cols.map((c) => c.length), 1) * rowH + 40;
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('class', 'svgmap'); svg.style.height = Math.min(H, 520) + 'px'; svg.setAttribute('preserveAspectRatio', 'xMinYMin meet');
  const mk = (tag, at, txt) => { const e = document.createElementNS(ns, tag); for (const k in at) e.setAttribute(k, at[k]); if (txt != null) e.textContent = txt; return e; };
  ['TOMBOL', 'AKSI', 'EVENT', 'TUJUAN'].forEach((t, i) => svg.append(mk('text', { x: colX[i], y: 14, class: 'colh' }, t)));
  const pos = (c, n) => [colX[c], 24 + n.i * rowH];
  edges.forEach(([a, b, dash]) => {
    const ca = cols.findIndex((c) => c.includes(a)), cb = cols.findIndex((c) => c.includes(b));
    const [x1, y1] = pos(ca, a), [x2, y2] = pos(cb, b);
    svg.append(mk('path', { class: 'ln', d: `M${x1 + bw},${y1 + 10} C${x1 + bw + 25},${y1 + 10} ${x2 - 25},${y2 + 10} ${x2},${y2 + 10}`, 'stroke-dasharray': dash ? '4 3' : '' }));
  });
  cols.forEach((c, ci) => c.forEach((n) => {
    const [x, y] = pos(ci, n);
    const g = mk('g', { class: 'nb' + (n.miss ? ' miss' : ''), style: n.node ? 'cursor:pointer' : '' });
    g.append(mk('rect', { x, y, width: bw, height: 20, rx: 4 }), mk('text', { x: x + 6, y: y + 14 }, n.label.length > 27 ? n.label.slice(0, 26) + '…' : n.label));
    g.append(mk('title', {}, n.label));
    if (n.node) g.addEventListener('click', () => { const root = curRoot(); const p = S.paths.get(n.node); if (p) { setMode('layout'); setSel([p]); } });
    svg.append(g);
  }));
  return svg;
}

/* ===== Tampilan Kode: Lua (bytecode + sumber dekompilasi), JSON, teks ===== */
function openCode(path) { S.codeFile = path; setMode('code'); }
let codeChip = 'all';

function renderCode() {
  const v = $('#view-code'); if (!v) return; v.replaceChildren();
  const files = [...P.files.values()].filter((f) => ['lua', 'layout', 'dd', 'nav', 'vvm', 'lreq', 'styles', 'assetpaths', 'fonts', 'constants', 'manifest', 'uxmetatypes', 'text'].includes(f.kind)).sort((a, b) => a.path.localeCompare(b.path));
  if (!files.length) { v.append(h('div', { class: 'hint' }, h('h2', null, 'Belum ada file'), 'Buka ZIP/folder dulu.')); return; }
  if (!S.codeFile || !P.files.has(S.codeFile)) S.codeFile = (files.find((f) => f.kind === 'lua') || files[0]).path;
  const f = P.files.get(S.codeFile);
  const sel = h('select', { style: { flex: 1, maxWidth: '520px' } }, files.map((x) => h('option', { value: x.path }, uxRel(x.path) + (x.kind === 'lua' ? (x.luaBC ? '  [bytecode]' : '  [teks]') : '') + (isDirty(x) ? ' •' : ''))));
  sel.value = f.path; sel.addEventListener('change', () => { S.codeFile = sel.value; renderCode(); });
  v.append(h('div', { class: 'ctool' }, sel, h('button', { onclick: () => saveSingle(f.path) }, '⬇ Simpan file ini')));
  if (f.kind === 'lua' && f.luaBC) return codeBytecode(v, f);
  codeText(v, f);
}

function codeText(v, f, opts = {}) {
  const isJson = JSON_KINDS.has(f.kind);
  const ta = h('textarea', { class: 'code', spellcheck: false, style: { borderRight: 0 } });
  const cur = () => (isJson ? (fileJSON(f) !== null ? (isDirty(f) ? serializeJSON(f.json) : bytesToText(f.bytes)) : bytesToText(f.bytes)) : fileText(f));
  ta.value = cur();
  const status = h('span', { class: 'small muted' }, isJson && f.parseError ? 'JSON rusak: ' + f.parseError : '');
  const apply = () => {
    if (isJson) {
      let j; try { j = JSON.parse(ta.value); } catch (e) { status.textContent = 'JSON tidak valid: ' + e.message; status.style.color = 'var(--err)'; return toast('JSON tidak valid: ' + e.message, 'err'); }
      if (f.parseError) { f.parseError = null; f.origJ = undefined; }
      edit('Edit ' + short(f.path), [f.path], () => { f.json = j; });
    } else edit('Edit ' + short(f.path), [f.path], () => { f.text = ta.value; });
    status.textContent = 'Diterapkan'; status.style.color = 'var(--ok)'; toast('Perubahan diterapkan ke ' + short(f.path));
  };
  const find = h('input', { type: 'text', placeholder: 'cari…', style: { width: '140px' } });
  const repl = h('input', { type: 'text', placeholder: 'ganti dengan…', style: { width: '140px' } });
  const nextFind = () => { const q = find.value; if (!q) return; let i = ta.value.indexOf(q, ta.selectionEnd); if (i < 0) i = ta.value.indexOf(q); if (i < 0) return toast('Tidak ditemukan'); ta.focus(); ta.setSelectionRange(i, i + q.length); const line = ta.value.slice(0, i).split('\n').length; ta.scrollTop = Math.max(0, (line - 4) * 18); };
  find.addEventListener('keydown', (e) => { if (e.key === 'Enter') nextFind(); });
  const bar = h('div', { class: 'ctool' }, h('button', { class: 'primary', onclick: apply }, 'Terapkan'), find, h('button', { onclick: nextFind }, 'Cari'), repl,
    h('button', { onclick: () => { const q = find.value; if (!q) return; const n = ta.value.split(q).length - 1; ta.value = ta.value.split(q).join(repl.value); toast(`${n} diganti (klik Terapkan untuk menyimpan)`); } }, 'Ganti semua'), status);
  if (opts.note) v.append(opts.note);
  if (!opts.noBar) v.append(bar);
  v.append(h('div', { class: 'codewrap' }, h('div', { style: { flex: 1 } }, ta)));
  if (S.codeFilter) { find.value = S.codeFilter; S.codeFilter = null; setTimeout(nextFind, 50); }
  return ta;
}

function codeBytecode(v, f) {
  let bc; try { bc = LuaBC.parse(f.bytes); } catch (e) { v.append(h('div', { class: 'warnbox' }, 'Gagal membaca bytecode: ' + e.message)); return; }
  const src = srcOf(f.path);
  const wrap = h('div', { class: 'codewrap' }); v.append(wrap);
  // kiri: sumber
  const left = h('div', { style: { flex: 1.1 } });
  if (src) {
    left.append(h('div', { class: 'infobox', style: { margin: 0, borderRadius: 0 } }, 'Sumber hasil dekompilasi (' + uxRel(src.path) + '). Mengubah teks ini TIDAK mengubah bytecode game; untuk mengubah perilaku, edit konstanta string di kanan.'));
    const ta = h('textarea', { class: 'code', spellcheck: false }); ta.value = fileText(src);
    ta.addEventListener('change', () => { edit('Edit sumber ' + short(src.path), [src.path], () => { src.text = ta.value; }); });
    left.append(ta);
    if (S.codeFilter) setTimeout(() => { const i = ta.value.indexOf(S.codeFilter); if (i >= 0) { ta.focus(); ta.setSelectionRange(i, i + S.codeFilter.length); ta.scrollTop = Math.max(0, (ta.value.slice(0, i).split('\n').length - 4) * 18); } }, 50);
  } else left.append(h('div', { class: 'pad muted' }, 'Sumber dekompilasi untuk file ini tidak ada. Gunakan Buka → "Tambah ZIP ke proyek" untuk memuat lua-hasil.zip, supaya hubungan tombol→Lua terbaca lebih akurat.'));
  // kanan: konstanta
  const right = h('div', { style: { flex: 1, minWidth: 0, borderLeft: '1px solid var(--line)' } });
  const info = h('div', { class: 'pad small muted' }, LuaBC.info(bc) + ' · 5142 konstanta se-proyek'.replace('5142', String(0)));
  info.textContent = LuaBC.info(bc);
  const q = h('input', { type: 'text', placeholder: 'cari konstanta string…', value: S.codeFilter || '', style: { flex: 1 } });
  const chips = h('div', { style: { display: 'flex', gap: '4px' } }, [['all', 'Semua'], ['evt_', 'evt_'], ['act_', 'act_'], ['bnd_', 'bnd_'], ['LTXT', 'LTXT']].map(([k, l]) => h('button', { class: 'sm' + (codeChip === k ? ' on' : ''), onclick: () => { codeChip = k; draw(); $$('button', chips).forEach((b, i) => b.classList.toggle('on', ['all', 'evt_', 'act_', 'bnd_', 'LTXT'][i] === k)); } }, l)));
  const list = h('div', { class: 'scroll' });
  const note = h('div', { class: 'warnbox', style: { margin: '0 8px' } }, 'Ini string asli di dalam bytecode. Mengganti mis. evt_… di sebuah fungsi mengubah tujuan navigasi yang ditembakkan skrip. Panjang string bebas; struktur bytecode tetap valid.');
  const draw = () => {
    list.replaceChildren(); const fq = q.value.toLowerCase();
    const all = LuaBC.strings(bc);
    const rows = all.map((e, idx) => ({ e, idx })).filter(({ e }) => (codeChip === 'all' || e.text.startsWith(codeChip)) && (!fq || e.text.toLowerCase().includes(fq)));
    if (S.codeFilter && !fq) { /* tidak terpakai */ }
    rows.slice(0, 300).forEach(({ e, idx }) => {
      const inp = h('input', { type: 'text', value: e.text, spellcheck: false, style: { width: '100%' } });
      const orig = e.text;
      inp.addEventListener('change', () => {
        edit(`Ubah string di ${short(f.path)}`, [f.path], () => { const r = LuaBC.patch(f.bytes, (b2) => { const ent = LuaBC.strings(b2)[idx]; LuaBC.setString(ent, inp.value); }); f.bytes = r.bytes; });
        toast('String bytecode diubah'); renderCode();
      });
      const all2 = h('button', { class: 'sm', title: 'Ganti semua kemunculan string ini di file', onclick: () => { if (inp.value === orig) return toast('Ubah teks di kolom dulu'); const n = patchLuaString(f.path, orig, inp.value); toast(`${n} kemunculan diganti`); renderCode(); } }, '⇆');
      list.append(h('div', { class: 'kv', style: { gridTemplateColumns: '78px 1fr 30px', padding: '2px 8px' } }, h('div', { class: 'k', title: e.fn + ' baris ' + e.line }, e.fn + (e.line ? ':' + e.line : '')), inp, all2));
    });
    if (rows.length > 300) list.append(h('div', { class: 'pad muted' }, `Menampilkan 300 dari ${rows.length}. Gunakan pencarian.`));
    if (!rows.length) list.append(h('div', { class: 'pad muted' }, 'Tidak ada yang cocok.'));
  };
  q.addEventListener('input', debounce(draw, 150));
  right.style.display = 'flex'; right.style.flexDirection = 'column';
  right.append(info, h('div', { class: 'tline', style: { padding: '0 8px' } }, q, chips), note, list);
  draw(); S.codeFilter = null;
  wrap.append(left, right);
}

/* ---- 11-app.js ---- */
/* ===== Rangka aplikasi: menu, mode, init ===== */
function closeDrawers() { document.body.classList.remove('show-left', 'show-right'); }

function setMode(m) {
  S.mode = m;
  $$('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.m === m));
  $$('.view').forEach((v) => v.classList.toggle('on', v.id === 'view-' + m));
  $('#body').classList.toggle('no-right', m !== 'layout');
  if (m !== 'layout') document.body.classList.remove('show-right');
  if (m === 'layout') { renderCanvas(); if (!S.fitted && S.layout) { fitView(); S.fitted = true; } renderLayers(); renderInspector(); }
  else renderActive();
  renderFiles();
}
function renderActive() {
  if (S.mode === 'links') renderLinks();
  else if (S.mode === 'code') renderCode();
  else if (S.mode === 'assets') renderAssets();
  else if (S.mode === 'styles') renderStyles();
  else if (S.mode === 'big') renderBig();
  else if (S.mode === 'rx3') renderRx3();
}

function showMenu(btn, items) {
  $$('.menu-list').forEach((m) => m.remove());
  const r = btn.getBoundingClientRect();
  const list = h('div', { class: 'menu-list', style: { left: Math.min(r.left, window.innerWidth - 260) + 'px', top: r.bottom + 4 + 'px' } },
    items.map((it) => (it === '-' ? h('hr') : (typeof it === 'string' ? h('small', null, it) : h('button', { onclick: () => { list.remove(); it.fn(); } }, it.label)))));
  document.body.append(list);
  const off = (e) => { if (!list.contains(e.target)) { list.remove(); document.removeEventListener('pointerdown', off, true); } };
  setTimeout(() => document.addEventListener('pointerdown', off, true), 0);
}
async function openZipDialog(merge) {
  const fs = await pickFiles({ accept: '.zip,application/zip', multiple: false }); if (!fs.length) return;
  try { await loadZip(fs[0], { merge }); } catch (e) { toast('Gagal membaca ZIP: ' + e.message, 'err'); console.error(e); }
  afterLoad();
}
async function openFolderDialog() {
  try {
    if (window.showDirectoryPicker) { const dh = await window.showDirectoryPicker({ mode: 'readwrite' }); await loadDirHandle(dh); }
    else { const fs = await pickFiles({ directory: true, multiple: true }); await loadFolderInput(fs); }
  } catch (e) { if (e.name !== 'AbortError') toast('Gagal memuat folder: ' + e.message, 'err'); }
  afterLoad();
}
async function openLooseDialog() {
  const fs = await pickFiles({ multiple: true }); if (!fs.length) return;
  const added = await loadLooseFiles(fs);
  if (added && added.length === 1 && P.files.get(added[0]).kind === 'layout') openLayout(added[0]);
  afterLoad();
}
function afterLoad() {
  renderFiles(); refreshDatalists();
  if (S.layout && !P.files.has(S.layout)) { S.layout = null; S.sel = []; }
  if (!S.layout) {
    const pref = [...P.files.keys()].filter((p) => p.endsWith('.layout'));
    const main = pref.find((p) => /MainHub\.layout$/.test(p)) || pref[0];
    if (main) openLayout(main);
  } else { renderCanvas(); }
  if (S.mode !== 'layout') renderActive();
}

function updateChrome() {
  { const real = [...P.files.values()].filter((f) => !f.virtual).length; const vn = P.files.size - real; $('#pname').textContent = P.files.size ? `${P.name} · ${real} file${vn ? ' + ' + vn + ' gambar .big' : ''}` : ''; }
  const d = dirtyFiles().length; const b = $('#dirty');
  b.style.display = d ? '' : 'none'; b.textContent = d + ' diubah'; b.title = d + ' file diubah dan belum disimpan';
  $('#b-undo').disabled = !Hist.undo.length; $('#b-redo').disabled = !Hist.redo.length;
  $('#b-undo').title = Hist.undo.length ? 'Urungkan: ' + Hist.undo[Hist.undo.length - 1].label : 'Urungkan';
}

  initCanvas(); initPanels();
  $$('#tabs button').forEach((b) => { b.onclick = () => setMode(b.dataset.m); });
  $$('.ptabs button[data-p]').forEach((b) => { b.onclick = () => { $$('.ptabs button[data-p]').forEach((x) => x.classList.toggle('on', x === b)); $('#pane-files').style.display = b.dataset.p === 'files' ? 'flex' : 'none'; $('#pane-layers').style.display = b.dataset.p === 'layers' ? 'flex' : 'none'; if (b.dataset.p === 'layers') renderLayers(); }; });
