<style>
:root{box-sizing:border-box;--bg:#14171c;--bg2:#1b1f26;--bg3:#232833;--bg4:#2c3340;--line:#323a48;--fg:#e6e9ef;--fg2:#9aa4b5;--fg3:#6b7587;--acc:#3d9bff;--acc2:#1f6fd1;--ok:#35c07a;--warn:#f0b23a;--err:#ee5a5a;--sel:#ffb02e;--r:6px;--top:46px;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root[data-theme="light"]{--bg:#eef0f4;--bg2:#ffffff;--bg3:#f3f5f9;--bg4:#e3e8f0;--line:#ccd3de;--fg:#1c2230;--fg2:#566074;--fg3:#8a93a5;--acc:#1768d6;--acc2:#0f52ad}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px/1.35 var(--font);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--bg4);border:1px solid var(--line);border-radius:var(--r);padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--acc)}button:active{background:var(--bg3)}button:disabled{opacity:.45;cursor:default}
button.p,button.on{background:var(--acc2);border-color:var(--acc);color:#fff}button.ghost{background:transparent;border-color:transparent}button.ghost:hover{background:var(--bg4)}button.danger{color:var(--err)}
input[type=text],input[type=number],select,input:not([type]){background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 6px;min-width:0}
input:focus,select:focus{outline:1px solid var(--acc);border-color:var(--acc)}input[type=checkbox]{accent-color:var(--acc)}
input[type=text]{flex:1;min-width:130px}input[type=number]{width:74px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:5px}::-webkit-scrollbar-track{background:transparent}
#app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:var(--top) minmax(0,1fr);height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.top{display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}.top::-webkit-scrollbar{display:none}
.brand{font-weight:800;letter-spacing:.15px;margin-right:8px;display:flex;align-items:center;gap:8px;color:var(--fg);white-space:nowrap}

:root[data-theme="light"] .brand i{filter:brightness(0)}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}
.tabs{display:flex;gap:2px;background:var(--bg);padding:2px;border-radius:8px;border:1px solid var(--line)}.tabs button{border:0;background:transparent;border-radius:6px;padding:5px 11px}.tabs button.on{background:var(--acc2);color:#fff}
.grow{flex:1}.chip{color:var(--fg2);max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chip.dirty{color:var(--warn)}
#body{display:flex;min-height:0;min-width:0;position:relative}.tool{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.ctool{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:none}.ctool::-webkit-scrollbar{display:none}
.ctool label{display:flex;gap:4px;align-items:center;color:var(--fg2);white-space:nowrap}.ctool select{max-width:150px}.ctool input[type=text]{max-width:220px}
.note{flex:none;margin:0;padding:4px 10px;background:var(--bg2);border-bottom:1px solid var(--line);color:var(--fg3);font-size:12px}
.app{flex:1;min-height:0;display:flex}.view{flex:1;min-width:0;display:flex;overflow:hidden;background:var(--bg)}.vc{flex:1;min-width:0;overflow:auto;padding:8px}
.drawer{background:var(--bg2);display:flex;flex-direction:column;overflow-y:auto;width:330px;flex:none;border-left:1px solid var(--line)}
.app.left{flex-direction:row-reverse}.app.left .drawer{border-left:0;border-right:1px solid var(--line)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;font-weight:700;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg2);z-index:1}
.dempty{display:none;padding:20px 14px;color:var(--fg2);text-align:center}.drawer:not(.open)>*{display:none}.drawer:not(.open)>.dempty{display:block}
#dbody{padding-bottom:20px}#dbody>.r{padding:8px 10px}.scrim{display:none!important}

<script>
/* nerutlabs DB Editor (HTML) - inti: format DB biner EA FIFA, CSV, ZIP */
'use strict';
const TL = {};

// ------------------------------------------------------------- util byte
const UTF8E = new TextEncoder(), UTF8D = new TextDecoder('utf-8');

class DbError extends Error {}
TL.DbError = DbError;

// ------------------------------------------------------------- progress (async, tidak membekukan UI)
const PR = { cb: null, last: 0 };
const nowMs = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());
const due = () => nowMs() - PR.last > 40;

// ------------------------------------------------------------- CRC-32/MPEG-2
const CRC_T = new Uint32Array(256);

// CRC-32 standar (untuk ZIP)
const CRC_Z = new Uint32Array(256);

// ------------------------------------------------------------- tanggal (hari sejak 1582-10-14)
function daysFromCivil(y, m, d) {
  y -= m <= 2 ? 1 : 0;
  const era = Math.floor((y >= 0 ? y : y - 399) / 400), yoe = y - era * 400;
  const doy = Math.floor((153 * (m + (m > 2 ? -3 : 9)) + 2) / 5) + d - 1;
  const doe = yoe * 365 + Math.floor(yoe / 4) - Math.floor(yoe / 100) + doy;
  return era * 146097 + doe - 719468;
}
const EPOCH = daysFromCivil(1582, 10, 14);
const dateToDays = (y, m, d) => daysFromCivil(y, m, d) - EPOCH;
function daysToDate(n) {
  const z = n + EPOCH + 719468, era = Math.floor((z >= 0 ? z : z - 146096) / 146097), doe = z - era * 146097;
  const yoe = Math.floor((doe - Math.floor(doe / 1460) + Math.floor(doe / 36524) - Math.floor(doe / 146096)) / 365);
  const y = yoe + era * 400, doy = doe - (365 * yoe + Math.floor(yoe / 4) - Math.floor(yoe / 100));
  const mp = Math.floor((5 * doy + 2) / 153), dd = doy - Math.floor((153 * mp + 2) / 5) + 1, mm = mp < 10 ? mp + 3 : mp - 9;
  const yy = y + (mm <= 2 ? 1 : 0), p = (x, l) => String(x).padStart(l, '0');

}
function parseDate(s) {
  s = s.trim();
  if (/^-?\d+$/.test(s)) return parseInt(s, 10);
  const p = s.split(/[-/.]/).map(Number);
  if (p.length < 3 || p.some(isNaN)) throw new DbError('Format tanggal salah: ' + s);
  return dateToDays(p[0], p[1], p[2]);
}
const todayDays = () => { const d = new Date(); return dateToDays(d.getFullYear(), d.getMonth() + 1, d.getDate()); };

// ------------------------------------------------------------- bit
function getBits(r, off, len) {
  const b0 = off >> 3, sh = off & 7, nb = (sh + len + 7) >> 3;

  for (let i = nb - 1; i >= 0; i--) v = v * 256 + r[b0 + i];
  v = Math.floor(v / Math.pow(2, sh));

}
function setBits(r, off, len, val) {
  const lo = val % 4294967296;   // len <= 32
  for (let i = 0; i < len; i++) {
    const bit = off + i;
    if ((lo >>> i) & 1) r[bit >> 3] |= (1 << (bit & 7)); else r[bit >> 3] &= ~(1 << (bit & 7));

}

// ------------------------------------------------------------- Huffman
class Huffman {
  constructor(nodes) { this.nodes = nodes; this.codes = new Array(256).fill(null); this.build(); }
  static parse(buf, start, end) {
    const cnt = Math.floor((end - start) / 4), u = new Array(cnt * 2);
    for (let i = 0; i < u.length; i++) u[i] = u16(buf, start + i * 2);
    let max = 0; const st = [0], seen = new Set();
    while (st.length) {
      const n = st.pop();
      if (seen.has(n)) continue; seen.add(n);
      if (n * 2 + 1 >= u.length) throw new DbError('pohon Huffman tidak valid');
      max = Math.max(max, n);
      for (let k = 0; k < 2; k++) { const v = u[2 * n + k]; if (v & 0xFF) st.push(v); }

  }
  build() {
    this.codes.fill(null);

      const [n, pre] = st.pop();
      for (let b = 0; b < 2; b++) { const v = this.nodes[n][b]; if (v & 0xFF) st.push([v, pre + b]); else this.codes[v >> 8] = pre + b; }

  decode(buf, ptr) {
    const len = buf[ptr]; let bit = (ptr + 1) * 8, node = 0; const out = new Uint8Array(len); let k = 0;
    while (k < len) {
      const x = (buf[bit >> 3] >> (7 - (bit & 7))) & 1; bit++;
      const v = this.nodes[node][x];

    }

  }
  canEncode(s) { const b = UTF8E.encode(s); for (let i = 0; i < b.length && i < 255; i++) if (this.codes[b[i]] === null) return false; return true; }
  encode(s) {

    for (let i = 0; i < len; i++) { const c = this.codes[b[i]]; if (c === null) throw new DbError('karakter tidak ada di pohon Huffman: ' + s); bits += c; }

}

// ------------------------------------------------------------- Field / Table
class Field {
  constructor() { this.name = ''; this.sn = ''; this.mtype = ''; this.ftype = 0; this.offset = 0; this.depth = 0; this.low = 0; this.high = 0; this.raw = null; }
  kind() { return (this.ftype === 0 || this.ftype === 13) ? 'str' : this.ftype === 4 ? 'real' : this.mtype === 'DATE' ? 'date' : 'int'; }
  max() { return this.depth >= 53 ? Infinity : this.low + Math.pow(2, this.depth) - 1; }
}
const LATIN1 = new TextDecoder('latin1');

class Table {
  constructor(sn, name, raw, meta) {
    this.sn = sn; this.name = name; this.raw = raw; this.dirty = false; this.loaded = false; this.readonly = false; this.partial = false; this.error = null;
    this.w0 = u32(raw, 0); this.recsz = u32(raw, 4); this.bits1 = u32(raw, 8); this.w3 = u32(raw, 12);

      if (m) { f.name = m[0]; f.mtype = m[1]; f.low = parseInt(m[3], 10) || 0; f.high = parseInt(m[4], 10) || 0; } else f.name = f.sn;
      this.fields.push(f); this.fmap.set(f.name, f);
      if (f.ftype === 13) this.hasCstr = true;

    if (this.error) throw new DbError(this.error);

      this.error = 'Tabel memakai format string yang belum didukung (read-only): ' + e.message; this.loaded = false;
      throw new DbError(this.error);

  }

            col[i] = UTF8D.decode(ex.subarray(ptr + 1, ptr + 1 + len));

        }
        this.cs.set(f.name, col);
      }

  }
  chk() { if (this.readonly) throw new DbError('Tabel "' + this.name + '" read-only (format string kompleks).'); }

  getInt(i, f) { if (typeof f === 'string') f = this.f(f); return getBits(this.recs[i], f.offset, f.depth) + f.low; }

  getStr(i, f) {

  getText(i, f) {

  }

  setInt(i, f, v) {

  }
  setStr(i, f, s) {
    if (typeof f === 'string') f = this.f(f);

  }

      case 'date': this.setInt(i, f, parseDate(s)); break;
      default: { const v = s.indexOf('.') >= 0 ? Math.trunc(parseFloat(s)) : parseInt(s, 10); if (isNaN(v)) throw new DbError(f.name + ': bukan angka: ' + s); this.setInt(i, f, v); }
    }
  }
  addRow() {
    this.load(); this.chk();
    if (this.recs.length >= 65535) throw new DbError('tabel penuh (maks 65535 baris)');

  }
  copyRow(src) { const i = this.addRow(); this.recs[i] = this.recs[src].slice(); for (const c of this.cs.values()) c[i] = c[src]; return i; }
  deleteRows(idx) {
    this.load(); this.chk();

    this.recs = this.recs.filter((_, i) => !gone.has(i));

  }
  keyField() { for (const f of this.fields) if (f.kind() === 'int') return f; return this.fields[0]; }

  serialize() {
    if (!this.dirty) return this.raw;

      const blob = []; let size = 0;
      const push = (a) => { blob.push(a); size += a.length; };
      if (!this.plain) push(this.huff.serialize());
      for (const f of this.fields) {
        if (f.ftype !== 13) continue;
        const col = this.cs.get(f.name);
        for (let i = 0; i < n; i++) {
          const s = col[i]; let ptr;

          else {
            ptr = size;
            if (this.plain) { const b = UTF8E.encode(s), l = Math.min(b.length, 255), e = new Uint8Array(l + 1); e[0] = l; e.set(b.subarray(0, l), 1); push(e); }
            else push(this.huff.encode(s));

        }

      extra = concat(blob);
    }

    const hb = concat([w32(this.w0), w32(this.recsz), w32(this.bits1), w32(w3n), w32((n | (n << 16)) >>> 0), w32(this.w5), w32(this.fields.length), w32(this.w7)]);
    return concat([hb, w32(crcMpeg(hb, 0, 32)), pl, w32(crcMpeg(pl, 0, pl.length))]);
  }
}

// ------------------------------------------------------------- Database
function parseMeta(xml) {

// ---- CSV tabel biasa (nama kolom = nama field; nilai mentah seperti hasil export)
function importTable(L, table, bytes, mode, keyName, apply) {
  const csv = TL.Csv.parse(bytes), T = L.t(table), fm = new Map(T.fields.map(f => [f.name.toLowerCase(), f]));
  const use = [], unknown = []; csv.cols.forEach((c, i) => { if (fm.has(c.toLowerCase())) use.push(i); else unknown.push(c); });
  if (!use.length) throw new DbError('Tidak ada kolom CSV yang cocok dengan field tabel ' + table);
  const kf = keyName && keyName.trim() ? T.f(keyName.trim()) : T.keyField(), kcol = csv.col(kf.name), index = new Map();
  if (kcol >= 0) for (let i = 0; i < T.n(); i++) index.set(T.getRaw(i, kf), i);
  const rep = { m: new Map(), errors: [] }; rep.m.set('baris_csv', csv.rows.length); rep.m.set('kolom_dipakai', use.length); rep.m.set('kolom_tak_dikenal', unknown.join(', ') || '-');
  let upd = 0, add = 0, n = 0;
  for (const r of csv.rows) {
    n++;
    try {
      const kv = kcol >= 0 && kcol < r.length ? r[kcol].trim() : '', hit = kv ? index.get(kv) : undefined, setAll = (i) => { for (const ci of use) { const f = fm.get(csv.cols[ci].toLowerCase()); if (ci < r.length && (r[ci].trim() !== '' || f.kind() === 'str')) T.setText(i, f, r[ci]); } };
      if (hit !== undefined && (mode === 'update' || mode === 'upsert')) { if (apply) setAll(hit); upd++; }
      else if (hit === undefined && (mode === 'append' || mode === 'upsert')) { if (apply) { const i = T.addRow(); setAll(i); if (kv) index.set(kv, i); } add++; }
    } catch (e) { if (rep.errors.length < 30) rep.errors.push('baris ' + (n + 1) + ': ' + e.message); }
  }
  rep.m.set('diupdate', upd); rep.m.set('ditambah', add); if (apply) { L.invalidate(); L.ensure(); }
  return rep;
}

// ---- export
const cellRaw = (t, i, f) => t.getRaw(i, f);
function exportTable(L, name) {
  const T = L.t(name), w = new TL.CsvWriter(); w.row(T.fields.map(f => f.name));
  for (let i = 0; i < T.n(); i++) w.row(T.fields.map(f => cellRaw(T, i, f))); return w.bytes();
}
async function exportAll(db, sourceName) {
  const ts = db.order.slice().sort((a, b) => a.name.toLowerCase() < b.name.toLowerCase() ? -1 : a.name.toLowerCase() > b.name.toLowerCase() ? 1 : 0);
  const files = [], man = new TL.CsvWriter(), sch = new TL.CsvWriter();
  man.row(['table', 'shortname', 'rows', 'fields', 'status', 'note']); sch.row(['table', 'field', 'shortname', 'kind', 'storage', 'bits', 'min', 'max', 'bit_offset']);
  let total = 0, nok = 0, nro = 0, npart = 0;
  let ti = 0;
  for (const t of ts) {
    if (++ti % 3 === 0 && due()) await tick(100 * ti / ts.length, 'Mengekspor tabel ' + ti + '/' + ts.length + ' (' + t.name + ')');
    let status = 'ok', note = '';
    try { t.load(); } catch (e) { t.loadPartial(); }
    if (t.partial) { status = 'strings_unreadable'; note = 'kolom string tidak bisa didecode (rusak di sumber); kolom lain lengkap'; npart++; }
    else if (t.readonly) { status = 'readonly'; note = 'string terbaca tapi belum bisa ditulis ulang identik; jangan diubah'; nro++; } else nok++;
    const w = new TL.CsvWriter(); w.row(t.fields.map(f => f.name)); const n = t.n();
    for (let i = 0; i < n; i++) w.row(t.fields.map(f => cellRaw(t, i, f)));
    files.push({ name: t.name + '.csv', data: w.bytes() }); total += n;
    man.row([t.name, t.sn, n, t.fields.length, status, note]);
    for (const f of t.fields) { const k = f.kind(), isn = k === 'int' || k === 'date'; sch.row([t.name, f.name, f.sn, k, f.ftype === 13 ? 'compressed_string' : f.ftype === 0 ? 'fixed_string' : f.ftype === 4 ? 'float32' : 'int', f.depth, isn ? f.low : '', isn ? f.max() : '', f.offset]); }
  }
  files.push({ name: '_manifest.csv', data: man.bytes() }, { name: '_schema.csv', data: sch.bytes() });
  const readme = 'Format: nerutlabs-DBCSV-1\r\nSumber: ' + sourceName + '\r\nTabel: ' + ts.length + '   Baris total: ' + total + '\r\n\r\n- Satu CSV per tabel database; kolom = field tabel sesuai urutan di database.\r\n- Nilai ditulis apa adanya (angka mentah). Field DATE = hari sejak 1582-10-14. String = teks UTF-8.\r\n- _schema.csv: tipe, lebar bit, min/max. _manifest.csv: jumlah baris dan status tiap tabel.\r\n- Status readonly / strings_unreadable: jangan diubah lewat import.\r\n';
  files.push({ name: 'README.txt', data: new TextEncoder().encode(readme) });
  await tick(99, 'Membuat ZIP…');
  return { zip: TL.makeZip(files), summary: 'Tabel: ' + ts.length + ' (ok ' + nok + ', readonly ' + nro + ', string rusak ' + npart + ')  Baris total: ' + total };
}

/* NerutLabs parent Save Gate bridge: only the two download actions require a sponsor click. */
(function(){
  var PARENT_ORIGIN='https://nerutlabs.blogspot.com';
  var pendingAction=null, requestSeq=0;
  function askNerutSaveGate(action){
    if(window.parent===window){ return false; }
    pendingAction=action;
    var requestId='db-editor-'+action+'-'+(++requestSeq)+'-'+Date.now();
    window.parent.postMessage({type:'TUREN_SAVE_REQUEST',requestId:requestId,action:action},PARENT_ORIGIN);
    toast(action==='export-zip'?'Lanjutkan melalui tombol sponsor untuk Export ZIP.':'Lanjutkan melalui tombol sponsor untuk menyimpan database.');
    return true;
  }
  window.addEventListener('message',function(event){
    if(event.origin!==PARENT_ORIGIN || event.source!==window.parent) return;
    var d=event.data;
    if(!d || typeof d!=='object' || d.type!=='TUREN_SAVE_UNLOCKED' || !pendingAction) return;
    var action=pendingAction; pendingAction=null;
    if(action==='save-db') saveDb(true);
    else if(action==='export-zip') exportAllZip(true);
    else if(action==='export-one-csv') exportOne(true);
  });
  window.__nerutAskSaveGate=askNerutSaveGate;
})();

function saveDb(unlocked) {
  if (!unlocked && window.__nerutAskSaveGate && window.__nerutAskSaveGate('save-db')) return;
  task('Menyimpan database', async () => {
    const bytes = await S.db.serializeAsync(0, 90); await tick(92, 'Memverifikasi CRC semua tabel…'); const bad = TL.FifaDb.verify(bytes);
    if (bad.length) throw new Error('Verifikasi gagal, file tidak dibuat: ' + bad.join(', ')); await tick(100, 'Selesai'); return bytes;
  }).then(b => { download(S.name, b); S.dirty = false; head(); toast('File diunduh (' + (b.length / 1024 | 0) + ' KB, CRC terverifikasi). Ganti file asli dengan file ini; simpan cadangan aslinya.'); }, () => { });
}
function runValidate() { task('Memvalidasi integritas', async () => { await tick(10, 'Memeriksa susunan inti, skuad, referensi nama…'); const r = S.L.validate(); await tick(100, ''); return r; }).then(l => info('Validasi', l.length ? l.join('\n') : 'OK - tidak ada masalah integritas terdeteksi.'), () => { }); }
function relineup() { task('Mengatur ulang lineup semua tim', async () => { const L = S.L, c = await L.rebuildAllLineups(0, 95); await tick(96, 'Memperbaiki peran tim…'); const r = L.repairRoles(); await tick(100, 'Selesai'); return [c, r]; }).then(([c, r]) => { markDirty(); toast('Lineup diatur ulang untuk ' + c + ' tim; peran tim diperbaiki: ' + r); }, () => { }); }
function exportAllZip(unlocked) {

function tgrid() {
  const T = S.L.t(S.tb.name), tb = S.tb, cols = tb.cols[tb.name].filter(c => T.fmap.has(c)).map(c => T.f(c));
  const sf = T.fields.filter(f => f.kind() === 'str'), q = tb.q.toLowerCase(), isNum = /^-?\d+$/.test(tb.q), kf = T.keyField(); const idx = [];
  for (let i = 0; i < T.n(); i++) { if (tb.q) { let hit = isNum && T.getInt(i, kf) === parseInt(tb.q); if (!hit) for (const f of sf) if (T.getStr(i, f).toLowerCase().includes(q)) { hit = true; break; } if (!hit) continue; } idx.push(i); }
  if (tb.sort && T.fmap.has(tb.sort)) { const f = T.f(tb.sort), str = f.kind() === 'str', val = i => str ? T.getStr(i, f).toLowerCase() : f.kind() === 'real' ? T.getReal(i, f) : T.getInt(i, f); idx.sort((a, b) => { const x = val(a), y = val(b), c = x < y ? -1 : x > y ? 1 : 0; return tb.desc ? -c : c; }); }
  setNote(tb.name + (T.readonly ? ' (read-only)' : '') + ' · ' + idx.length + ' baris');
  $('#tg').innerHTML = `<table class="t"><thead><tr>${cols.map(f => `<th onclick="gSort('${f.name}')">${esc(f.name)}${tb.sort === f.name ? (tb.desc ? ' ▼' : ' ▲') : ''}</th>`).join('')}</tr></thead><tbody>${idx.slice(tb.off, tb.off + 40).map(i => `<tr data-i="${i}">${cols.map(f => `<td>${esc(T.getText(i, f))}</td>`).join('')}</tr>`).join('')}</tbody></table>
  <div class="pager"><button ${tb.off ? '' : 'disabled'} onclick="S.tb.off-=40;tgrid()">◀</button><span>${idx.length ? tb.off + 1 : 0}–${Math.min(tb.off + 40, idx.length)} / ${idx.length}</span><button ${tb.off + 40 < idx.length ? '' : 'disabled'} onclick="S.tb.off+=40;tgrid()">▶</button></div>`;
  document.querySelectorAll('#tg tbody tr').forEach(tr => tr.onclick = () => { document.querySelectorAll('tr.sel').forEach(x => x.classList.remove('sel')); tr.classList.add('sel'); rowDrawer(T, +tr.dataset.i); });
}
function colsDrawer() { const T = S.L.t(S.tb.name); drawer('Kolom ditampilkan', sec('Kolom', '<div class="fg">' + T.fields.map(f => `<label class="ck"><input type="checkbox" data-c="${esc(f.name)}" ${S.tb.cols[S.tb.name].includes(f.name) ? 'checked' : ''}> ${esc(f.name)}</label>`).join('') + '</div>') + '<div class="r"><button class="p" id="cApply">Terapkan</button></div>', d => { d.querySelector('#cApply').onclick = () => { const c = [...d.querySelectorAll('[data-c]')].filter(i => i.checked).map(i => i.dataset.c); S.tb.cols[S.tb.name] = c.length ? c : [T.fields[0].name]; closeDrawer(); tgrid(); }; }); }
function gSort(c) { if (S.tb.sort === c) S.tb.desc = S.tb.desc ? 0 : 1; else { S.tb.sort = c; S.tb.desc = 0; } tgrid(); }
function gAdd() { guard(() => { const T = S.L.t(S.tb.name), i = T.addRow(); markDirty(); tgrid(); rowDrawer(T, i); }); }
function rowDrawer(T, ri) {
  const after = () => { S.L.invalidate(); S.L.ensure(); markDirty(); closeDrawer(); tgrid(); };
  drawer(T.name + ' #' + ri, sec('Field', '<div class="fg">' + T.fields.map(f => inputFor(f, T.getText(ri, f), 'rf_' + f.name)).join('') + '</div>') + (T.readonly ? '<p class="mut">Read-only</p>' : '<div class="r"><button class="p" id="rs">Simpan</button><button id="rc">Duplikat</button><button id="rd" class="danger">Hapus</button></div>'), d => {
    if (T.readonly) return;
    d.querySelector('#rs').onclick = () => guard(() => { for (const [k, v] of Object.entries(collect(d))) T.setText(ri, T.f(k), v); after(); toast('Tersimpan'); });
    d.querySelector('#rc').onclick = () => guard(() => { T.copyRow(ri); after(); toast('Diduplikasi (ubah ID bila perlu)'); });
    d.querySelector('#rd').onclick = () => guard(() => { if (!confirm('Hapus baris ini?')) return; T.deleteRows([ri]); after(); });
  });
}

/* ================= CSV ================= */
V.csv = () => {
  const c = S.csv, fc = c && TL.isFc(c), tables = S.db.order.filter(t => !t.readonly && !t.error).map(t => t.name).sort();
  setTool(`<input type="file" id="cf" accept=".csv,.txt,text/csv" hidden><button class="p" onclick="$('#cf').click()">Pilih CSV…</button><button onclick="csvRun(false)" ${c ? '' : 'disabled'}>Pratinjau</button><button class="p" onclick="csvRun(true)" ${c ? '' : 'disabled'}>Terapkan</button><button onclick="csvOptions()" ${c ? '' : 'disabled'}>⚙ Opsi</button><span class="sep"></span><button onclick="exportAllZip()">Export ZIP semua tabel</button><select id="et">${tables.map(t => `<option>${esc(t)}</option>`).join('')}</select><button onclick="exportOne()">CSV tabel</button>`);
  setNote(c ? S.csvName + ' · ' + c.rows.length + ' baris · ' + c.cols.length + ' kolom · ' + (fc ? 'format pemain FC' : 'tabel biasa') : 'Pilih file CSV untuk diimport.');
  setView(`<div class="vc"><div class="card"><h3>Import CSV</h3>${c ? `<p>${esc(S.csvName)} — <b>${fc ? 'format pemain FC' : 'tabel biasa'}</b></p>${fc ? `<ul class="mut"><li><b>Pemain wanita tidak diimport.</b></li><li>Klub CSV jadi acuan: pemain dipindah ke klub CSV; klub tak ada / kosong / penuh → free agent.</li><li>Tim di liga yang tidak ada di CSV dibiarkan utuh. Skuad maks ${TL.MAX_SQUAD}.</li><li>Pemain baru mendapat penampilan unik; lineup per zona posisi.</li></ul>` : ''}<p class="mut">Atur opsi di panel ⚙ Opsi, lalu Pratinjau → Terapkan.</p>` : '<p class="mut">Belum ada CSV dipilih. Tekan <b>Pilih CSV…</b></p>'}</div><div id="crep"></div></div>`);
  $('#cf').onchange = async (e) => { const f = e.target.files[0]; if (!f) return; try { await task('Membaca CSV', async () => { await tick(5, 'Membaca ' + f.name + '…'); const b = new Uint8Array(await f.arrayBuffer()); await tick(50, 'Mengurai baris & kolom…'); S.csv = TL.Csv.parse(b); S.csvBytes = b; S.csvName = f.name; await tick(100, S.csv.rows.length + ' baris'); }); V.csv(); csvOptions(); } catch (x) { } };
  if (c && window.innerWidth > 900) csvOptions();
};
function csvOptions() {
  const c = S.csv; if (!c) return; const fc = TL.isFc(c), o = S.fc, tables = S.db.order.filter(t => !t.readonly && !t.error).map(t => t.name).sort();
  const cb = (id, label, on) => `<label class="ck"><input type="checkbox" id="${id}" ${on ? 'checked' : ''}> ${label}</label>`;
  drawer('Opsi import', fc ? sec('Pemain', cb('o_u', 'Update pemain yang sudah ada (atribut, posisi, kaki, tgl lahir)', o.update) + cb('o_a', 'Tambah pemain baru', o.add) + cb('o_n', 'Ikut perbarui nama pemain lama', o.names)) + sec('Klub', cb('o_s', 'Samakan klub dengan CSV (pindah ke klub CSV; klub tak ada / penuh → free agent)', o.sync) + cb('o_d', '🗑 HAPUS pemain lama yang tidak ada di CSV (pensiun)', o.del)) + sec('Batas & penampilan', `<div class="fg"><div class="fi"><label>Rating minimum</label><input id="o_m" type="number" value="${esc(o.omin)}"></div><div class="fi"><label>Skuad minimum per klub</label><input id="o_q" type="number" value="${o.minSquad}"></div></div><div class="fi"><label>Salin penampilan pemain baru dari ID (kosong = tiap pemain baru dibuat unik)</label><input id="o_t" type="number" value="${esc(o.tpl)}"></div>`)
    : sec('Tabel tujuan', `<div class="fi"><label>Tabel</label><select id="o_tb">${tables.map(t => `<option ${t === S.csvTable ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div><div class="fi"><label>Mode</label><select id="o_md"><option value="upsert">Update bila ID ada, tambah bila baru</option><option value="update">Hanya update</option><option value="append">Hanya tambah</option></select></div><div class="fi"><label>Kolom kunci (opsional)</label><input id="o_k" placeholder="otomatis"></div>`));
}
function exportOne(unlocked) {
  if (!unlocked && window.__nerutAskSaveGate && window.__nerutAskSaveGate('export-one-csv')) return; guard(() => { const n = $('#et').value; busy('Mengekspor ' + n, () => TL.exportTable(S.L, n), b => download(n + '.csv', b, 'text/csv')); }); }
async function csvRun(apply) {
  const c = S.csv, fc = TL.isFc(c); let run, label;
  if (!$('#panel').querySelector('#o_u') && !$('#panel').querySelector('#o_tb')) csvOptions();
  try {
    if (fc) {
      const g = (i) => $('#' + i).checked; Object.assign(S.fc, { update: g('o_u'), add: g('o_a'), names: g('o_n'), sync: g('o_s'), del: g('o_d'), omin: $('#o_m').value, minSquad: parseInt($('#o_q').value) || 0, tpl: $('#o_t').value });
      const o = { update: S.fc.update, add: S.fc.add, updateNames: S.fc.names, sync: S.fc.sync, deleteMissing: S.fc.del, minOverall: parseInt(S.fc.omin) || 0, minSquad: S.fc.minSquad, maxSquad: TL.MAX_SQUAD, template: parseInt(S.fc.tpl) || -1 };
      if (apply && !confirm((o.deleteMissing ? 'PERHATIAN: pemain yang ID-nya tidak ada di CSV akan DIHAPUS dari database (di memori; file baru berubah setelah kamu mengunduh hasilnya).\n\n' : '') + 'Terapkan import? Titik pemulihan dibuat dulu supaya bisa diurungkan. Proses bisa memakan waktu beberapa saat.')) return;
      label = 'import CSV pemain (' + S.csvName + ')'; run = () => TL.importFc(S.L, S.csvBytes, o, apply);
    } else {
      S.csvTable = $('#o_tb').value; const mode = $('#o_md').value, key = $('#o_k').value; if (apply && !confirm('Terapkan import ke tabel ' + S.csvTable + '?')) return;
      label = 'import CSV ke tabel ' + S.csvTable; run = () => TL.importTable(S.L, S.csvTable, S.csvBytes, mode, key, apply);
    }
  } catch (e) { return toast(e.message, 1); }
  const dirtyBefore = S.dirty; let snap = null;
  try {
    const rep = await task(apply ? 'Menerapkan perubahan database' : 'Menghitung pratinjau', async (ctl) => {
      if (apply) { ctl.range(0, 14); await tick(0, 'Membuat titik pemulihan (agar bisa diurungkan)…'); snap = await S.db.serializeAsync(0, 100); }
      ctl.range(apply ? 14 : 0, apply ? 96 : 100); const r = await run();
      if (apply) { ctl.range(96, 100); await tick(10, 'Menyusun struktur database…'); await tick(100, 'Selesai'); } return r;
    });
    if (apply) { S.undo = { bytes: snap, label: 'sebelum ' + label, dirty: dirtyBefore }; markDirty(); }
    $('#crep').innerHTML = `<div class="card"><h3>${apply ? 'Hasil (diterapkan)' : 'Pratinjau (belum mengubah apa pun)'}</h3><pre>${esc(TL.reportText(rep))}</pre>${apply ? '<p class="mut">Tab File → <b>Simpan ⬇ .db</b> untuk menyimpan hasilnya. Tombol <b>Urungkan</b> ada di tab File.</p>' : ''}</div>`;
  } catch (e) {
    if (apply && snap) { try { await task('Mengembalikan database', async () => { await reloadFrom(snap, 'Terjadi error; database dikembalikan ke kondisi sebelum import'); }); S.dirty = dirtyBefore; head(); } catch (x) { } }
  }
}
head(); go('file');

</script></body></html>
